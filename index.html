<title>Box to Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&display=swap">
<style>
/* Layout: pro sportswear app — jet black, volt green, ultra-condensed caps. Edge-to-edge sections split by hairlines, product-style training tiles, a broadcast-angle pitch. Single dark look by design. */
:root{
  --bg:#060606; --surface:#111111; --surface-2:#191919; --ink:#F5F6F0; --muted:#9A9E92; --line:#242622;
  --volt:#CCFF00; --on-volt:#060606; --kit:#CCFF00; --on-kit:#060606; --bib:#CCFF00; --bib-soft:#1C2308; --on-bib:#060606;
  --mind:#7FB2FF; --ment:#FF8A4C; --move:#3DDC84;
  --pitch:#0B0B0B; --pitch-2:#101010; --chalk:#CCFF00; --ball:#FFFFFF; --ball-ink:#060606;
  --f-display:"Archivo","Arial Narrow",Impact,sans-serif;
  --f-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--volt);outline-offset:3px}
h1,h2,h3,.d{font-family:var(--f-display);font-stretch:62%;font-weight:900;text-transform:uppercase;margin:0;text-wrap:balance}
h1{font-size:clamp(3.4rem,12vw,7.4rem);line-height:.82;letter-spacing:-.005em}
h2{font-size:clamp(2.3rem,6.5vw,3.6rem);line-height:.86}
h3{font-size:1.8rem;line-height:.9}
em.v{font-style:italic;color:var(--volt)}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
main{padding-block:0 130px;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:15px 28px;min-height:50px;background:var(--volt);color:var(--on-volt);font-weight:800;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;transition:transform .15s,background .2s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--volt);color:var(--volt)}
.btn.small{min-height:38px;padding:9px 18px;font-size:.7rem}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn svg{width:16px;height:16px}
.more{background:none;border:0;padding:0;font-weight:700;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);display:inline-flex;gap:8px;align-items:center;border-bottom:1.5px solid var(--volt);padding-bottom:3px}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(6,6,6,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-stretch:62%;font-weight:900;font-size:1.55rem;line-height:.88;letter-spacing:.01em;background:none;border:0;padding:0;text-align:left}
.brand .mark{width:28px;height:17px;background:var(--volt);transform:skewX(-22deg);flex:none}
.brand small{display:block;font-family:var(--f-body);font-stretch:100%;font-weight:700;font-size:.52rem;letter-spacing:.26em;color:var(--muted);margin-top:3px}
.topnav{display:flex;gap:0;border-top:1px solid var(--line);padding:0 16px;max-width:1180px;margin:0 auto}
.topnav button{flex:1;text-align:center}
.topnav button{background:none;border:0;padding:12px 14px;font-weight:700;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);position:relative;transition:color .2s}
.topnav button:hover{color:var(--ink)}
.topnav button[aria-current="page"]{color:var(--ink)}
.topnav button[aria-current="page"]::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:3px;background:var(--volt)}
.hdr .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.chip.v{background:var(--volt);color:var(--on-volt);border-color:var(--volt)}
.chip .fl{width:9px;height:12px;background:var(--volt);clip-path:polygon(50% 0,100% 60%,80% 100%,20% 100%,0 60%)}
@media (max-width:480px){.chip.st{display:none}}

/* ticker */
.ticker{background:var(--volt);color:var(--on-volt);overflow:hidden;white-space:nowrap}
.ticker .track{display:inline-flex;align-items:center;gap:26px;padding-block:9px;animation:tick 40s linear infinite}
.ticker span{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;font-size:1.3rem;text-transform:uppercase;line-height:1}
.ticker i{display:inline-block;width:20px;height:10px;background:var(--on-volt);transform:skewX(-22deg)}
@keyframes tick{to{transform:translateX(-50%)}}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:radial-gradient(ellipse 70% 60% at 85% 40%,rgba(204,255,0,.08),transparent 60%),var(--bg)}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:center;padding-block:56px 48px}
@media (max-width:880px){.hero .wrap{grid-template-columns:1fr;padding-block:36px 30px}}
.bgword{position:absolute;right:-1%;bottom:-.12em;font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;text-transform:uppercase;font-size:clamp(9rem,28vw,24rem);line-height:.8;color:transparent;-webkit-text-stroke:1.5px rgba(204,255,0,.14);pointer-events:none;white-space:nowrap;user-select:none}
.lead{font-size:1.08rem;color:var(--muted);max-width:44ch}
.stadium{perspective:1000px;margin-block:-7% -5%}
.stadium .pitchwrap{transform:rotateX(50deg) rotateZ(-10deg) scale(.96);transform-origin:50% 55%;box-shadow:0 60px 80px -20px rgba(0,0,0,.9),0 0 0 1px rgba(204,255,0,.25),0 0 60px rgba(204,255,0,.08);transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.stadium:hover .pitchwrap{transform:rotateX(44deg) rotateZ(-6deg) scale(.98)}
.pitchwrap{border-radius:3px;overflow:hidden;background:var(--pitch);line-height:0;max-width:100%}
.pitchwrap svg{width:100%;height:auto;display:block}
.ballg{transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}

/* stat strip */
.strip{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.strip > div{padding:22px 18px 18px;border-right:1px solid var(--line);min-width:0;display:flex;flex-direction:column;gap:6px}
.strip > div:first-child{padding-left:0}
.strip > div:last-child{border-right:0}
.strip b{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;text-transform:uppercase;font-size:clamp(2rem,5vw,3.1rem);line-height:.85;overflow-wrap:anywhere}
.strip b.v{color:var(--volt)}
@media (max-width:640px){.strip{grid-template-columns:1fr 1fr}.strip>div{padding-left:0!important;padding-right:12px}.strip>div:nth-child(2){border-right:0}.strip>div:nth-child(-n+2){border-bottom:1px solid var(--line)}.strip>div:nth-child(odd){padding-right:12px}.strip>div:nth-child(even){padding-left:16px!important}}
.prog{height:4px;background:var(--line);margin-top:-1px}
.prog i{display:block;height:100%;background:var(--volt);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.progcap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:10px}

/* sections */
.sec{padding-top:56px}
.sechd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sechd .stack{gap:8px}
.phd{padding-block:40px 24px;border-bottom:1px solid var(--line);margin-bottom:28px}

/* product tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:30px 16px}
.tile{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:12px;min-width:0}
.art{position:relative;aspect-ratio:4/3;max-width:100%;overflow:hidden;border-radius:2px;background:linear-gradient(155deg,color-mix(in srgb,var(--c) 30%,#111) 0%,#111 62%)}
.art::before{content:"";position:absolute;right:14%;top:-20%;width:20%;height:150%;background:var(--c);transform:skewX(-22deg);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.art::after{content:"";position:absolute;right:38%;top:-20%;width:4%;height:150%;background:var(--c);opacity:.55;transform:skewX(-22deg);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.tile:hover .art::before{transform:skewX(-22deg) translateX(-18px)}
.tile:hover .art::after{transform:skewX(-22deg) translateX(-30px)}
.art .word{position:absolute;left:14px;bottom:4px;z-index:1;font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;text-transform:uppercase;font-size:clamp(3.6rem,7vw,5rem);line-height:.8;color:transparent;-webkit-text-stroke:1.5px var(--ink);opacity:.92}
.art .xpb{position:absolute;top:12px;left:12px;z-index:1;background:var(--volt);color:var(--on-volt);font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;font-size:1.15rem;padding:4px 10px;line-height:1}
.art .dn{position:absolute;top:12px;right:12px;z-index:1;background:var(--ink);color:var(--bg);font-size:.62rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:6px 9px;display:flex;gap:6px;align-items:center}
.art .dn svg{width:11px;height:11px}
.tile.done .art{filter:saturate(.35) brightness(.75)}
.tile .cat{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--c)}
.tile h3{font-size:1.95rem}
.tile .meta{color:var(--muted);font-size:.85rem}

/* tabs / pills */
.utabs{display:flex;gap:26px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-top:22px}
.utabs button{background:none;border:0;padding:0 0 12px;font-weight:800;font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);position:relative}
.utabs button[aria-pressed="true"]{color:var(--ink)}
.utabs button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--volt)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.pills button{border:1px solid var(--line);background:none;border-radius:999px;padding:9px 16px;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.pills button span{color:var(--muted);font-weight:600;margin-left:4px}
.pills button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pills button[aria-pressed="true"] span{color:inherit;opacity:.6}

/* 3 Ms */
.pms{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:620px){.pms{grid-template-columns:1fr}.pm{min-height:130px!important}}
.pm{position:relative;overflow:hidden;padding-top:44px!important;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 14%,#0f0f0f),#0f0f0f 70%);border-radius:2px;padding:18px;min-height:200px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;min-width:0}
.pm::before{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:300px;background:var(--c);opacity:.2;transform:skewX(-22deg)}
.pm::after{content:"";position:absolute;right:42px;top:-30px;width:12px;height:300px;background:var(--c);opacity:.6;transform:skewX(-22deg)}
.pm .ix{position:absolute;top:16px;left:18px;font-size:.64rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:800}
.pm .cnt{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;font-size:3.6rem;line-height:.8}
.pm b{position:relative;font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;font-size:2.6rem;line-height:.85;text-transform:uppercase;color:var(--c)}
.pm p{position:relative;font-size:.86rem;opacity:.8;max-width:24ch}

/* detail */
.dhero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:linear-gradient(155deg,color-mix(in srgb,var(--c) 24%,var(--bg)) 0%,var(--bg) 65%)}
.dhero::before{content:"";position:absolute;right:10%;top:-20%;width:14%;height:160%;background:var(--c);opacity:.85;transform:skewX(-22deg)}
.dhero::after{content:"";position:absolute;right:28%;top:-20%;width:3%;height:160%;background:var(--c);opacity:.45;transform:skewX(-22deg)}
.dhero .wrap{position:relative;z-index:1;padding-block:22px 40px;display:flex;flex-direction:column;gap:16px}
.dhero .bgword{-webkit-text-stroke-color:rgba(255,255,255,.1);z-index:0}
.dgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;padding-top:36px}
@media (max-width:820px){.dgrid{grid-template-columns:1fr;gap:28px}}
.block{display:flex;flex-direction:column;gap:14px}
.block > .eyebrow{padding-bottom:10px;border-bottom:1px solid var(--line)}
.readtext{font-size:1.16rem;line-height:1.7;max-width:60ch}
.readtext.big{font-size:1.38rem;line-height:1.75}
.steps{list-style:none;margin:0;padding:0}
.steps label{display:flex;gap:16px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:1.02rem}
.steps input{appearance:none;-webkit-appearance:none;width:28px;height:28px;margin:0;border:2px solid var(--muted);border-radius:50%;flex:none;display:grid;place-items:center;transition:all .15s}
.steps input:checked{background:var(--volt);border-color:var(--volt)}
.steps input:checked::after{content:"";width:11px;height:6px;border-left:3px solid var(--on-volt);border-bottom:3px solid var(--on-volt);transform:translateY(-1px) rotate(-45deg)}
.steps .n{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;font-size:1.35rem;color:var(--muted);width:22px;flex:none;line-height:1.2}
.steps input:checked ~ .tx{color:var(--muted)}
.panel{background:var(--surface);border-radius:2px;padding:22px;display:flex;flex-direction:column;gap:16px}
.timer{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;font-size:clamp(4.4rem,14vw,6.4rem);line-height:.85;text-align:center}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feel button{border:1px solid var(--line);background:none;border-radius:2px;padding:14px 6px;font-weight:800;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:8px}
.feel button svg{width:30px;height:30px}
.feel button[aria-pressed="true"]{border-color:var(--volt);color:var(--volt);background:var(--bib-soft)}
select,input[type=text],textarea{font:inherit;color:var(--ink);background:var(--bg);border:0;border-bottom:1.5px solid var(--line);border-radius:0;padding:12px 0;width:100%;font-size:1.05rem}
select{padding-right:8px}
select:focus,input[type=text]:focus,textarea:focus{outline:none;border-bottom-color:var(--volt)}
textarea{min-height:84px;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{letter-spacing:normal;text-transform:none;font-weight:500;color:var(--ink)}

/* signup */
.signup{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
@media (max-width:820px){.signup{grid-template-columns:1fr;gap:24px}}
.sstep{display:grid;grid-template-columns:44px 1fr;gap:6px 14px;padding-block:20px;border-bottom:1px solid var(--line)}
.sstep .k{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;font-size:2rem;line-height:.9;color:var(--volt)}
.sstep h3{font-size:1.5rem;margin-bottom:6px}
.hint{font-size:.82rem;color:var(--muted);margin-top:8px}
.kitstage{position:relative;overflow:hidden;display:grid;place-items:center;padding:34px 0 26px;background:radial-gradient(ellipse 55% 16% at 50% 92%,rgba(204,255,0,.22),transparent 70%),linear-gradient(180deg,#141414,#060606);border-radius:2px}
.kitstage::before{content:"";position:absolute;left:8%;top:-20%;width:16%;height:150%;background:var(--volt);opacity:.07;transform:skewX(-22deg)}
.kitstage svg{position:relative;width:min(280px,64%);height:auto;filter:drop-shadow(0 26px 20px rgba(0,0,0,.7));transition:transform .4s}
.kitstage:hover svg{transform:translateY(-6px) rotate(-1.5deg)}
.kitmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:800;padding-top:12px}
.swatches{display:flex;gap:14px;flex-wrap:wrap;padding-top:6px}
.sw{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.25);padding:0;transition:transform .15s}
.sw:hover{transform:scale(1.1)}
.sw[aria-pressed="true"]{outline:2px solid var(--volt);outline-offset:4px}

/* table */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:10px;margin-bottom:28px}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.pod .nm{font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .xpv{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;font-size:1.3rem;color:var(--muted)}
.pod .blk{width:100%;display:grid;place-items:start center;padding-top:10px;background:var(--surface);font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;font-size:3.2rem;line-height:1}
.pod.p1 .blk{height:150px;background:var(--volt);color:var(--on-volt)}
.pod.p2 .blk{height:110px}
.pod.p3 .blk{height:80px}
.list{border-top:1px solid var(--line)}
.lrow{display:grid;grid-template-columns:40px 40px 1fr auto;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}
.lrow.me{background:var(--bib-soft);box-shadow:inset 3px 0 0 var(--volt)}
.lrow .rk{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;font-size:1.6rem;text-align:center;color:var(--muted)}
.lrow .nm{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .sub{font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.lrow .pts{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;font-size:1.7rem;text-align:right;line-height:1}
.lrow .pts small{display:block;font-family:var(--f-body);font-stretch:100%;font-style:normal;font-weight:700;font-size:.6rem;letter-spacing:.14em;color:var(--muted)}
.notice{padding:16px 18px;background:var(--surface);font-size:.9rem;border-left:3px solid var(--volt);margin-bottom:20px}
.shirt{width:40px;height:40px;flex:none}
.shirt text{font-family:var(--f-display);font-stretch:62%;font-weight:900}
.xlink{background:none;border:0;padding:0;color:var(--muted);font-size:.7rem;text-decoration:underline}

/* pathway */
.mrow{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
@media (max-width:720px){.mrow{grid-template-columns:repeat(2,1fr)}}
.mrow > div{padding:16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.mrow b{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;font-size:2.2rem;line-height:.85;color:var(--muted)}
.mrow .got b{color:var(--volt)}
.mrow .nowl{background:var(--bib-soft)}
.mrow span{font-weight:700;font-size:.92rem}
.mrow small{font-size:.72rem;color:var(--muted);letter-spacing:.08em}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 18px;border-top:1px solid var(--line)}
@media (max-width:820px){.stages{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.stages{grid-template-columns:1fr}}
.stg{padding:22px 18px 22px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-width:0}



.stg .k{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;font-size:2.4rem;line-height:.85;text-transform:uppercase}
.stg.here .k{color:var(--volt)}

/* locker */
.locker{display:grid;grid-template-columns:minmax(0,420px) 1fr;gap:40px;align-items:center}
@media (max-width:820px){.locker{grid-template-columns:1fr;gap:20px}}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.badge{display:flex;flex-direction:column;gap:8px;padding:18px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.badge svg{width:40px;height:46px}
.badge b{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-size:1.35rem;line-height:.9;text-transform:uppercase}
.badge span{font-size:.76rem;color:var(--muted);line-height:1.4}
.badge.off{opacity:.42}
.hist{border-top:1px solid var(--line)}
.hrow{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:16px 0;border-bottom:1px solid var(--line)}
.hrow .t{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-size:1.4rem;text-transform:uppercase;line-height:.95}
.hrow .x{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;font-size:1.4rem;color:var(--volt)}
.hrow .q{grid-column:1/-1;color:var(--muted);font-size:.9rem}
.cat{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;font-weight:800}
.grown{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border-top:1px solid var(--line)}
@media (max-width:720px){.grown{grid-template-columns:1fr}}
.grown > div{padding:18px 18px 18px 0;border-bottom:1px solid var(--line);font-size:.92rem;color:var(--muted)}
.grown > div b{display:block;color:var(--ink);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px}

/* bottom nav (phones) */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(6,6,6,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
nav.tabs button{letter-spacing:.04em!important;font-size:.52rem!important}
nav.tabs button{background:none;border:0;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.58rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button[aria-current="page"]{color:var(--volt)}
nav.tabs{display:none!important}#toast{bottom:32px!important}
.subnav{display:flex;gap:22px;overflow-x:auto;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:112px;z-index:20;scrollbar-width:none}
.subnav button{background:none;border:0;padding:14px 0;font-weight:800;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);position:relative;white-space:nowrap}
.subnav button[aria-current="page"]{color:var(--ink)}
.subnav button[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--volt)}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--volt);color:var(--on-volt);padding:12px 24px;border-radius:999px;font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;font-size:1.5rem;text-transform:uppercase;pointer-events:none;transition:all .35s cubic-bezier(.2,.8,.2,1);z-index:40;text-align:center;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* guided programme */
.coach{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;background:var(--surface);padding:18px;border-left:3px solid var(--volt);max-width:640px}
.coach .av{width:44px;height:44px;border-radius:50%;background:var(--volt);display:grid;place-items:center}
.coach .av span{width:18px;height:11px;background:var(--on-volt);transform:skewX(-22deg)}
.coach > div > b{display:block;font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--volt);margin-bottom:6px}
.coach p{font-size:1.02rem;line-height:1.55}
.playbar{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:20;background:rgba(6,6,6,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.playbar .wrap{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.playbar .eyebrow{color:var(--ink);max-width:50vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.segs{display:flex;gap:4px;flex:1;min-width:140px}
.segs i{flex:1;height:5px;background:var(--line)}
.segs i.on{background:var(--volt)}
.x{background:none;border:1px solid var(--line);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;flex:none;font-weight:800}
.stepwrap{padding-block:44px 24px;display:flex;flex-direction:column;gap:26px;max-width:820px}
.bigstep{font-size:clamp(1.7rem,4.8vw,2.7rem);font-weight:800;line-height:1.22;max-width:26ch;letter-spacing:-.01em}
.stimer{display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap;background:var(--surface);padding:22px 24px}
.stimer .timer{text-align:left}
.need{list-style:none;padding:0;margin:0}
.need li{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;font-weight:600}
.need li::before{content:"";width:12px;height:7px;background:var(--volt);transform:skewX(-22deg);flex:none}
.nailed{background:var(--bib-soft);border-left:3px solid var(--volt);padding:18px 20px;font-size:1.15rem;font-weight:700;line-height:1.45}
details.ex{background:var(--surface);padding:14px 16px}
details.ex summary{cursor:pointer;font-weight:800;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--volt)}
details.ex p{margin-top:10px;color:var(--ink);opacity:.85}
.stepnav{display:flex;gap:10px;flex-wrap:wrap;padding-top:6px}
.feature{display:grid;grid-template-columns:1.1fr 1fr;background:var(--surface);border-radius:2px;overflow:hidden}
@media (max-width:760px){.feature{grid-template-columns:1fr}.feature .art{min-height:180px!important}}
.feature .art{aspect-ratio:auto;min-height:260px;border-radius:0}
.feature .fb{padding:26px;display:flex;flex-direction:column;gap:14px;justify-content:center;min-width:0}
.rail{display:grid;grid-template-columns:repeat(18,1fr) 3fr;gap:3px}
.rail i{height:10px;background:var(--line)}
.rail i.on{background:var(--volt)}
.rail i.cur{background:repeating-linear-gradient(-45deg,var(--volt) 0 3px,transparent 3px 8px);box-shadow:inset 0 0 0 1px var(--volt)}
.rail i.tr{background:transparent;box-shadow:inset 0 0 0 1.5px var(--volt)}
.rail i.tr.on{background:var(--volt)}
.raillab{display:grid;grid-template-columns:6fr 6fr 6fr 3fr;gap:3px;margin-top:8px}
.raillab .eyebrow{font-size:.6rem}
.art .st{position:absolute;top:12px;right:12px;z-index:1;font-size:.62rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:6px 9px;display:flex;gap:6px;align-items:center;background:var(--ink);color:var(--bg)}
.art .st.nx{background:var(--volt);color:var(--on-volt)}
.art .st svg{width:11px;height:11px}
.tile.locked .art{filter:grayscale(1) brightness(.4)}
.tile.locked h3,.tile.locked .meta,.tile.locked .cat{opacity:.5}
.phase{padding-top:40px}
.phhd{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.phhd .k{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;font-size:2rem;line-height:.9;color:var(--volt)}
.phhd h3{font-size:2rem}
.how{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.how>div{padding:22px 18px 22px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-width:0}
.how>div+div{padding-left:18px;border-left:1px solid var(--line)}
.how .k{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;font-size:2.4rem;line-height:.85;color:var(--volt)}
@media (max-width:720px){.how{grid-template-columns:1fr}.how>div+div{border-left:0;padding-left:0}}
.stg .rail{margin-top:6px}

/* form check */
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
@media (max-width:760px){.formgrid{grid-template-columns:1fr}}
.vid{width:100%;max-height:440px;background:#000;display:block;border-radius:2px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:280px;border:1.5px dashed var(--line);border-radius:2px;cursor:pointer;text-align:center;padding:24px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:.78rem;background:var(--surface);transition:border-color .2s,color .2s}
.drop:hover{border-color:var(--volt);color:var(--volt)}
.drop svg{width:44px;height:44px;color:var(--volt)}
.drop small{font-weight:600;letter-spacing:.04em;text-transform:none;color:var(--muted);font-size:.82rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;opacity:0}
.fpoints{list-style:none;margin:0;padding:0}
.fpoints li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
.fpoints input{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;border:2px solid var(--muted);border-radius:50%;display:grid;place-items:center}
.fpoints input:checked{background:var(--volt);border-color:var(--volt)}
.fpoints input:checked::after{content:"";width:10px;height:5px;border-left:3px solid var(--on-volt);border-bottom:3px solid var(--on-volt);transform:translateY(-1px) rotate(-45deg)}
.fpoints .lab{font-weight:700;cursor:pointer}
.mk{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:.75rem;font-weight:900;color:var(--muted)}
.mk.good{background:var(--volt);border-color:var(--volt);color:var(--on-volt)}
.mk.work_on{border-color:var(--ment);color:var(--ment)}
.fbk{font-size:.92rem;color:var(--muted);margin-top:4px}
.fbk.work_on{color:var(--ink)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:2px;background:var(--surface)}
.verdict{display:grid;gap:12px}
.small{font-size:.8rem;color:var(--muted)}
.working{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-weight:700}
.spin{width:20px;height:20px;border:3px solid var(--line);border-top-color:var(--volt);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.lvls{display:grid;gap:8px;margin-top:6px}
.lvlb{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:none;border:1px solid var(--line);border-radius:2px;padding:12px 14px}
.lvlb[aria-pressed="true"]{border-color:var(--volt);background:var(--bib-soft)}
.lvlb .muted{font-size:.82rem;letter-spacing:normal;text-transform:none;font-weight:500}
.lvname{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;font-size:1.5rem;line-height:1;text-transform:uppercase;color:var(--ink)}
.lvlb[aria-pressed="true"] .lvname{color:var(--volt)}
.lvl{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid var(--volt);background:var(--bib-soft);margin-top:6px;letter-spacing:normal;text-transform:none;font-weight:500;font-size:.88rem}

.drills{display:flex;flex-direction:column;border-top:1px solid var(--line)}
details.drill{border-bottom:1px solid var(--line)}
details.drill>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0}
details.drill>summary::-webkit-details-marker{display:none}
details.drill .plus{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-size:2.4rem;line-height:1;color:var(--c);transition:transform .2s;flex:none}
details.drill[open] .plus{transform:rotate(45deg)}
.dbody{display:flex;flex-direction:column;gap:20px;padding-bottom:26px;max-width:760px}
.lvlist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.lvlist b{display:block;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--volt)}
.posprof{background:var(--surface);border-left:3px solid var(--volt);padding:18px 20px;display:flex;flex-direction:column;gap:10px;margin-bottom:24px;max-width:760px}
.posprof p{font-size:1.02rem}
.verdict2{background:var(--surface);padding:24px;border-left:3px solid var(--volt);display:flex;flex-direction:column;gap:10px;max-width:820px}
.tblwrap{overflow-x:auto;border:1px solid var(--line)}
.btable{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums}
.btable th,.btable td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:.9rem;white-space:nowrap}
.btable thead th{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.btable thead th.cur{color:var(--volt)}
.btable td.cur{background:var(--bib-soft)}
.btable td.met{color:var(--volt);font-weight:800}
.btable td.met::after{content:" ✓"}
.btable tbody th{font-weight:700}
.rtag{display:inline-block;margin-left:6px;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;padding:3px 6px;background:var(--volt);color:var(--on-volt);vertical-align:middle}
.rtag.c{background:none;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.tcard{background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tin{display:flex;gap:10px;align-items:flex-end}
.tin .field{flex:1}
.src{padding:18px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;max-width:820px}
.src a{color:var(--volt);font-weight:800;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;display:inline-flex;gap:6px;align-items:center}

.bmbox{background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:14px;border-top:3px solid var(--volt)}
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.rung{background:var(--bg);padding:10px 6px;display:flex;flex-direction:column;gap:4px;min-width:0;border-bottom:3px solid var(--line)}
.rung .lv{font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;line-height:1.2;min-height:2.4em}
.rung b{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;font-size:1.5rem;line-height:1}
.rung.on{border-bottom-color:var(--volt)}
.rung.on b{color:var(--volt)}
.rung.you{box-shadow:inset 0 0 0 1px var(--volt)}
.trend{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.spark{width:160px;height:40px}
.wk{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.wd{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);font-weight:800;font-size:.75rem;color:var(--muted)}
.wd.on{background:var(--volt);border-color:var(--volt);color:var(--on-volt)}
.wd.td{box-shadow:0 0 0 2px var(--ink)}
.wkc{display:flex;flex-direction:column;margin-left:8px}
.wkc b{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;font-size:1.8rem;line-height:.9;color:var(--volt)}
.tlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.titem{display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 4px}
.titem b{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-size:1.45rem;text-transform:uppercase;line-height:.95}
.titem .tk{width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-weight:900;color:var(--on-volt)}
.titem.ok .tk{background:var(--volt);border-color:var(--volt)}
.titem.ok b{color:var(--muted)}
.titem:hover b{color:var(--volt)}

.placeban{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:var(--volt);color:var(--on-volt);padding:20px 22px}
.placeban b{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;font-size:1.9rem;line-height:.9;text-transform:uppercase}
.pbars{display:flex;flex-direction:column;gap:20px;max-width:820px}
.pb{height:10px;background:var(--line);margin-top:8px}
.pb i{display:block;height:100%;background:var(--volt)}
.pbl{display:flex;justify-content:space-between;margin-top:6px;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mq{display:flex;flex-direction:column;border-top:1px solid var(--line);max-width:820px}
.mrowq{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line)}
.mrowq p{flex:1;min-width:200px;font-weight:600}
.scale{display:flex;gap:6px}
.scale button{width:40px;height:40px;border:1px solid var(--line);background:none;font-weight:800;border-radius:2px}
.scale button[aria-pressed="true"]{background:var(--volt);border-color:var(--volt);color:var(--on-volt)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:700px){.cgrid{grid-template-columns:1fr}}

.fc{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:28px;align-items:center}
@media (max-width:760px){.fc{grid-template-columns:1fr}}
.fcd{max-width:340px;width:100%;margin:0 auto}
.diamond{width:100%;height:auto;display:block}
.clist{display:flex;flex-direction:column;gap:14px}
.crow{display:flex;flex-direction:column;gap:6px}
.cname{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;font-size:1.45rem;line-height:1;text-transform:uppercase;color:var(--c)}
.cbar{height:8px;background:var(--line)}
.cbar i{display:block;height:100%;background:var(--c)}
.ctag{display:inline-block;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;padding:3px 7px;box-shadow:inset 0 0 0 1px var(--c);color:var(--c);margin-right:4px;vertical-align:middle}

.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.mcard{display:flex;flex-direction:column;gap:8px;text-align:left;background:linear-gradient(160deg,color-mix(in srgb,var(--mind) 16%,#0f0f0f),#0f0f0f 70%);border:1px solid var(--line);padding:20px;min-height:200px;min-width:0}
.mcard b{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;font-size:2rem;line-height:.9;text-transform:uppercase}
.mcard:hover{border-color:var(--mind)}
.mcard.ok{border-color:var(--volt)}
.scale.ten{flex-wrap:wrap;gap:4px}
.scale.ten button{width:32px;height:36px;font-size:.8rem}
.resetbox{display:flex;flex-direction:column;gap:8px;max-width:640px}
.rs{display:grid;grid-template-columns:48px 1fr;gap:14px;align-items:center;padding:16px;background:var(--surface);opacity:.5;transition:all .3s}
.rs .k{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;font-size:2.2rem;line-height:1;color:var(--muted)}
.rs b{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-size:1.6rem;text-transform:uppercase;line-height:1}
.rs.on{opacity:1;background:var(--bib-soft);box-shadow:inset 3px 0 0 var(--volt);transform:scale(1.02)}
.rs.on .k{color:var(--volt)}
.rs.past{opacity:.8}
.scenopts{display:flex;flex-direction:column;gap:10px;max-width:720px}
.sopt{text-align:left;background:var(--surface);border:1px solid var(--line);padding:16px 18px;font-size:1.05rem;font-weight:600;border-radius:2px}
.sopt:hover:not([disabled]){border-color:var(--volt)}
.sopt.right{border-color:var(--volt);background:var(--bib-soft);color:var(--volt)}
.sopt.wrong{border-color:var(--ment);color:var(--ment)}

.ptabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ptabs button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--line);padding:12px 12px 10px;text-align:left;min-width:0}
.ptabs button b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;font-size:clamp(1.05rem,4.2vw,1.45rem);line-height:1;text-transform:uppercase;color:var(--muted)}
.ptabs button span{font-size:.7rem;color:var(--muted);font-weight:700;letter-spacing:.1em}
.ptabs button[aria-pressed="true"]{border-top-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.ptabs button[aria-pressed="true"] b{color:var(--c)}
.rails{display:flex;flex-direction:column;gap:12px}
.prail{display:flex;flex-direction:column;gap:6px}
.pr{display:flex;gap:3px}
.pr i{flex:1;height:9px;background:var(--line)}
.pr i.on{background:var(--c,var(--volt))}
.pr i.cur{background:repeating-linear-gradient(-45deg,var(--c,var(--volt)) 0 3px,transparent 3px 8px);box-shadow:inset 0 0 0 1px var(--c,var(--volt))}
.pr.big i{height:12px}
.titem .tk{border-color:var(--c,var(--muted))}
.titem.ok .tk{background:var(--c,var(--volt));border-color:var(--c,var(--volt))}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- drill pages: diagram, steps, target ---- */
.dsplit{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:18px}
@media(min-width:620px){.dsplit{grid-template-columns:1.25fr 1fr}}
.dia{margin:0;background:#0b0b0b;border:1px solid var(--line);padding:12px}
.dia svg{width:100%;height:auto;display:block}
.dia figcaption{font-size:.9rem;color:var(--muted);margin-top:8px;line-height:1.4}
.dtarget{background:color-mix(in srgb,var(--c) 14%,#0f0f0f);border-top:3px solid var(--c);padding:16px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.dtarget .num{font-size:2.2rem;color:var(--c);font-family:var(--f-display);font-weight:900;font-stretch:62%;font-style:italic;line-height:1}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.steps li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);padding:10px 12px;line-height:1.45}
.sn{flex:0 0 auto;width:28px;height:28px;display:grid;place-items:center;background:var(--c);color:var(--on-volt);font-family:var(--f-display);font-weight:900;font-stretch:62%;font-size:1rem}
.dchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.dchips span{background:var(--surface);border:1px solid var(--line);padding:7px 10px;font-size:.92rem}
/* ---- weekly challenge and squad goal ---- */
.wkchal{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--volt) 10%,#0f0f0f);border:1px solid var(--volt);border-left:4px solid var(--volt);padding:16px}
.wkchal.won{background:color-mix(in srgb,var(--volt) 22%,#0f0f0f)}
.squad{margin-top:12px;background:var(--surface);border:1px solid var(--line);padding:14px}
.sqbar{height:12px;background:#1a1a1a;border:1px solid var(--line);margin:6px 0 8px}
.sqbar i{display:block;height:100%;background:var(--volt)}
/* ---- journal ---- */
.jcard{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c);padding:14px;margin-top:10px}
.jcard summary::-webkit-details-marker{display:none}
.nnrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#0f0f0f;border:1px solid var(--line);color:var(--ink);padding:10px 12px;margin-top:6px;font:inherit;cursor:pointer}
.nnrow .tk{flex:0 0 auto;width:22px;height:22px;display:grid;place-items:center;border:2px solid var(--muted);font-weight:900}
.nnrow.ok{border-color:var(--volt)}
.nnrow.ok .tk{background:var(--volt);color:var(--on-volt);border-color:var(--volt)}
.fuelgate{padding:26px 22px;border:1.5px solid var(--volt);background:var(--surface);display:flex;flex-direction:column;gap:14px;max-width:640px}
.fuelgate h3{font-size:1.9rem}
.fuelmini{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.fuelmini li{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;padding:7px 10px;box-shadow:inset 0 0 0 1px var(--line)}
.fuelmini.big{display:flex;flex-direction:column;gap:0}
.fuelmini.big li{font-size:.95rem;letter-spacing:0;text-transform:none;font-weight:500;padding:14px 0;box-shadow:none;border-bottom:1px solid var(--line)}
.fuelprice{display:flex;flex-direction:column;gap:4px}
.fuelprice b{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;text-transform:uppercase;font-size:2rem;color:var(--volt)}
.fuelprev{display:flex;flex-wrap:wrap;gap:8px}
.fuelprev span{font-size:.8rem;padding:9px 12px;background:var(--surface);color:var(--muted)}
.fuelprev .more-t{color:var(--ink);box-shadow:inset 0 0 0 1px var(--volt)}
.fuelbasics{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
.fuelbasics>div{padding:18px 0;border-bottom:1px solid var(--line)}
.fuelbasics .k{font-family:var(--f-display);font-stretch:62%;font-weight:900;color:var(--volt);font-size:1.4rem}
.fuelbasics h3{font-size:1.3rem;margin:6px 0}
@media (max-width:640px){.fuelbasics{grid-template-columns:1fr}}
.fuelm summary{display:flex;justify-content:space-between;align-items:center;gap:14px;cursor:pointer;list-style:none}
.fuelm summary::-webkit-details-marker{display:none}
.fuelgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:12px}
.fuelgrid b{display:block;font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--volt);margin-bottom:8px}
.fuelgrid ul,.fuelgrid ol{padding-left:18px;margin:0;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
@media (max-width:640px){.fuelgrid{grid-template-columns:1fr}}
.fform{display:flex;flex-direction:column;gap:22px;padding:22px;border:1px solid var(--line);background:var(--surface);max-width:760px}
.fq{border:0;padding:0;margin:0;min-width:0}
.fq legend{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--volt);font-weight:800;margin-bottom:10px;padding:0}
.fqc{display:flex;flex-wrap:wrap;gap:8px}
.fqc label{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;font-size:.88rem}
.fqc label:has(input:checked){box-shadow:inset 0 0 0 2px var(--volt);color:var(--ink)}
.fqc input{accent-color:var(--volt)}
.fsdg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.fsd{display:flex;flex-direction:column;gap:4px;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.fsd select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:9px;text-transform:none;letter-spacing:0;font-size:.95rem}
.fday{display:flex;flex-direction:column;gap:3px;padding:14px 0;border-bottom:1px solid var(--line)}
.fday b{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--volt)}
.fday h4{font-size:1.1rem;font-weight:800}
.fbudget{padding:22px;border:1.5px solid var(--volt);background:var(--surface);margin-top:18px;display:flex;flex-direction:column;gap:10px}
.fbig{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-style:italic;text-transform:uppercase;font-size:2.6rem;line-height:1;color:var(--volt)}
.fbig small{font-family:var(--f-body);font-stretch:100%;font-style:normal;font-size:.8rem;letter-spacing:.06em;color:var(--muted);text-transform:none;font-weight:600}
.fshop{margin-top:22px}
.fshop h3{font-size:1.2rem;margin-bottom:8px}
.fshop ul{list-style:none;padding:0;margin:0}
.fshop li{display:flex;flex-direction:column;gap:3px;padding:12px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.fshop li small{color:var(--muted);font-size:.8rem}

/* ---- style pass: bolder type, square shapes, volt used for the key action ---- */
h1{font-size:clamp(3.8rem,14vw,9rem)}
h2{font-size:clamp(2.7rem,8vw,4.6rem);line-height:.84}
.btn,.chip,.pills button,.x,.fqc label,.fuelmini li,.fuelprev span,.feel button,.sw{border-radius:0!important}
.chip.v{animation:punch .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes punch{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.panel,.art,.feature,.pm,.fuelgate,.fform,.fbudget,.fuelm,.drill{border-radius:0!important}
.fuelgate,.fbudget{box-shadow:6px 6px 0 var(--volt)}
.fqc label:has(input:checked){background:var(--volt);color:var(--on-volt);box-shadow:none}
.fqc label:has(input:checked) span{color:var(--on-volt);font-weight:800}
.subnav button[aria-current="page"]{color:var(--volt)}
.subnav button[aria-current="page"]::after{height:4px}
.fshop h3{font-size:1.6rem;color:var(--volt)}
.fday h4{font-size:1.25rem;text-transform:uppercase;font-family:var(--f-display);font-stretch:62%;font-weight:900}
@media (prefers-reduced-motion:reduce){.chip.v{animation:none}}
</style>

<script>
/* ---------- content ---------- */
const STAGES={
  g:{name:"Mini Soccer",ages:"Ages 5–9",focus:"Where it all starts. Fall in love with the ball, have fun, be brave and try new things."},
  d:{name:"Sunday League",ages:"Age 10+",focus:"Build your base. Master the ball with both feet, bounce back fast and talk on the pitch."},
  y:{name:"Saturday League",ages:"Age 10+",focus:"Step up a level. Play under pressure, build habits, scan and own your mistakes."},
  a:{name:"Pre-Academy",ages:"Age 10+",focus:"Get scout-ready. Routines, recovery, resilience, and train like you're already there."},
  e:{name:"Academy",ages:"Age 10+",focus:"Elite level. Power, game intelligence, self-analysis and living like a pro every day."}
};
const STAGE_ORDER=["g","d","y","a","e"];
const PILLARS={
  mind:{name:"Mindset",verb:"Think",line:"How you think"},
  ment:{name:"Mentality",verb:"Respond",line:"How you act and bounce back"},
  move:{name:"Movement",verb:"Move",line:"How you move, with and without the ball"}
};
const LEVELS=[[0,"Six-Yard Box"],[100,"Penalty Spot"],[250,"Edge of the Area"],[450,"Defensive Third"],[700,"Halfway Line"],[1000,"Centre Circle"],[1400,"Middle Third"],[1900,"Final Third"],[2500,"Edge of Their Box"],[3200,"Box to Box"]];

const C=[
/* GRASSROOTS 5–8 */
{id:"g-m1",s:"g",p:"mind",t:"Not Yet!",xp:20,min:5,
 read:"Every great player makes mistakes. A mistake means your brain is learning. When you miss, do not say \"I can't\". Say \"Not yet!\" and try again.",
 steps:["Put a target on the floor, like a cushion or a box.","Kick a soft ball at it 10 times.","Every time you miss, say \"Not yet!\" out loud.","Count how many times you hit it."],
 reflect:"How did saying \"Not yet!\" make you feel?"},
{id:"g-m2",s:"g",p:"mind",t:"Superhero Stance",xp:15,min:3,
 read:"Standing tall can help you feel brave. Lots of players do this before a big game. Let's try it!",
 steps:["Stand with your feet apart.","Put your hands on your hips.","Chin up and a big smile.","Count to 20 slowly.","Say \"I am brave. I can do it!\""],
 reflect:"Did you feel braver after your stance?"},
{id:"g-m3",s:"g",p:"mind",t:"My Star Jar",xp:20,min:8,
 read:"It is good to remember the things you do well. Write them down or draw them, then keep them safe. Read them when you feel sad.",
 steps:["Find a jar, a box or an envelope.","Draw or write 3 things you did well this week.","Fold them up and put them in your Star Jar.","Show a grown-up one of your stars."],
 reflect:"Which star are you most proud of?"},
{id:"g-t1",s:"g",p:"ment",t:"Kit Bag Captain",xp:15,min:5,
 read:"Good players get ready by themselves. Can you pack your own football bag before training?",
 steps:["Boots in the bag.","Shin pads in the bag.","Water bottle filled up.","A coat if it is cold or rainy.","Ask a grown-up to check it."],
 reflect:"Did you remember everything on your own?"},
{id:"g-t2",s:"g",p:"ment",t:"Great Teammate",xp:20,min:5,
 read:"A great teammate helps other people feel happy. Say \"well done\", give a high five, and help tidy up. Teams win together.",
 steps:["Say \"well done\" to someone in your family today.","Give 3 high fives.","Help tidy up one thing at home.","At your next training, help pick up the cones."],
 reflect:"How did the other person feel when you helped?"},
{id:"g-t3",s:"g",p:"ment",t:"Fuel Like a Footballer",xp:10,min:3,
 read:"Your body is like a car. It needs fuel to go fast. Water, fruit, veg and good sleep are your fuel.",
 steps:["Drink a full glass of water.","Eat one piece of fruit or veg today.","Go to bed on time tonight."],
 reflect:"What is your favourite healthy food?"},
{id:"g-v1",s:"g",p:"move",t:"Toe Taps",xp:20,min:5,
 read:"Toe taps make your feet quick. Tap the top of the ball with one foot, then the other. Keep your head up if you can!",
 steps:["Put the ball in front of you.","Tap the top with your right foot, then your left.","Go for 20 seconds, then rest.","Do it 3 times. Try to go faster each time."],
 reflect:"Was it easier the third time?"},
{id:"g-v2",s:"g",p:"move",t:"Animal Warm-Up",xp:15,min:5,
 read:"Animals move in lots of ways. Moving like them makes you strong and helps your balance.",
 steps:["Bear crawl across the room.","Do 5 big frog jumps.","Crab walk backwards.","Stand on one leg like a flamingo and count to 10. Swap legs."],
 reflect:"Which animal was the hardest?"},
{id:"g-v3",s:"g",p:"move",t:"Dribble the Garden",xp:20,min:8,
 read:"Dribbling means keeping the ball close with little touches. Use both feet and look up to see where to go.",
 steps:["Put out 4 objects, like shoes or cushions.","Dribble around each one with little touches.","Now do it with your other foot.","Try it once looking up as much as you can."],
 reflect:"Which foot felt better?"},

/* DEVELOPMENT 9–11 */
{id:"d-m1",s:"d",p:"mind",t:"Next Ball Reset",xp:25,min:6,
 read:"After a mistake, the best players reset fast. They have a little routine: a clap, a breath, and the words \"next ball\". The mistake is over. The next action is what matters.",
 steps:["Choose your reset action: a clap, a touch of your socks, or a fist pump.","Take one slow breath in through your nose and out through your mouth.","Say \"next ball\" quietly to yourself.","Practise it 5 times while kicking a ball against a wall. Do the reset after every bad pass."],
 reflect:"Which reset action will you use in your next match?"},
{id:"d-m2",s:"d",p:"mind",t:"Picture It First",xp:25,min:6,
 read:"Top players imagine themselves doing well before they play. This is called visualisation. The more detail you picture, the more your brain feels ready.",
 steps:["Sit somewhere quiet and close your eyes.","Picture yourself making a great pass. What colour is your kit? What can you hear?","Picture a strong tackle or a block.","Picture yourself scoring or setting up a goal.","Open your eyes and write down your favourite picture."],
 reflect:"Which picture felt the most real?"},
{id:"d-m3",s:"d",p:"mind",t:"Goal Ladder",xp:30,min:10,
 read:"Big goals feel easier when you break them into small steps, like the rungs of a ladder. Each step you climb gets you closer.",
 steps:["Write one big football goal for this season.","Write 3 small steps that will help you get there.","Pick the first step and write when you will do it.","Stick your ladder somewhere you will see it."],
 reflect:"What is the first rung on your ladder?"},
{id:"d-t1",s:"d",p:"ment",t:"Talk Like a Leader",xp:25,min:5,
 read:"Talking on the pitch helps your team. Short, loud and clear words are best. Leaders talk even when they are tired.",
 steps:["Practise saying \"Man on!\" loud and clear.","Practise \"Time!\" (it means you have space).","Practise \"Turn!\" (it means you can turn).","Teach the three calls to someone at home."],
 reflect:"Which call will you use most in a game?"},
{id:"d-t2",s:"d",p:"ment",t:"Bounce Back Diary",xp:25,min:8,
 read:"Everyone has tough days. Losing, getting subbed, or making a mistake. What matters is what you do next. Writing it down helps you see how strong you are.",
 steps:["Write about a tough moment in football.","Write how it made you feel.","Write what you did next, or what you could do next time.","Write one thing you learned from it."],
 reflect:"What did you learn about yourself?"},
{id:"d-t3",s:"d",p:"ment",t:"Match Day Breakfast",xp:20,min:10,
 read:"What you eat before a game gives you energy. Good choices are things like porridge, toast, fruit, eggs or yoghurt, plus water. Try to eat 2 to 3 hours before kick-off.",
 steps:["Sit down with a grown-up.","Plan a match day breakfast together.","Write it down and put it on the fridge.","Fill your water bottle the night before."],
 reflect:"What is on your match day breakfast plan?"},
{id:"d-v1",s:"d",p:"move",t:"Wall Pass Workout",xp:30,min:10,
 read:"A wall is the best training partner. It always passes back! Use the inside of your foot and lock your ankle.",
 steps:["Stand 3 big steps from a wall.","Two-touch: control, then pass. 60 seconds.","One-touch with your right foot. 30 seconds.","One-touch with your left foot. 30 seconds.","Count your passes and try to beat it next time."],
 reflect:"How many passes did you get in 60 seconds?"},
{id:"d-v2",s:"d",p:"move",t:"Cone Weave",xp:25,min:8,
 read:"Agility means changing direction fast. Stay low, take small steps and push off hard.",
 steps:["Put 5 objects in a line, a big step apart.","Weave in and out without the ball, 3 times.","Now weave with the ball, 3 times.","Try to use the outside of your foot too."],
 reflect:"Did you stay low when you turned?"},
{id:"d-v3",s:"d",p:"move",t:"Keepy-Up Ladder",xp:30,min:10,
 read:"Keepy-ups improve your touch and balance. Use your laces, keep your toes up, and keep the ball low.",
 steps:["Try to do 5 in a row.","Then 10. Then 15.","Try a round using only your weaker foot.","Write down your best score."],
 reflect:"What is your new best score?"},

/* YOUTH 12–14 */
{id:"y-m1",s:"y",p:"mind",t:"Control the Controllables",xp:30,min:8,
 read:"Some things you can control: your effort, attitude, preparation and how you react. Some things you can't: the referee, the weather, the other team, the result. Spending energy on the second list drains you.",
 steps:["Draw two columns: \"I control\" and \"I don't control\".","Fill each with at least 4 things about your next match.","Circle the one thing you will focus on most.","Cross out the whole second column. That stuff isn't your job."],
 reflect:"What will you focus on in your next game?"},
{id:"y-m2",s:"y",p:"mind",t:"Box Breathing",xp:25,min:5,
 read:"Under pressure, your heart races and your thinking gets messy. Box breathing slows things down. Penalty takers, keepers and even pilots use it.",
 steps:["Breathe in through your nose for 4 seconds.","Hold for 4 seconds.","Breathe out slowly for 4 seconds.","Hold for 4 seconds.","Repeat the whole box 5 times."],
 reflect:"When could you use this in a match?"},
{id:"y-m3",s:"y",p:"mind",t:"Self-Talk Swap",xp:35,min:10,
 read:"The voice in your head can be your best coach or your worst critic. You can't stop every negative thought, but you can answer it back with something useful.",
 steps:["Write 3 negative thoughts you have had while playing.","For each one, write a helpful answer. Example: \"I always miss\" becomes \"Pick a corner and strike through it.\"","Choose your favourite new line.","Say it to yourself before your next session."],
 reflect:"Which swap will help you most?"},
{id:"y-t1",s:"y",p:"ment",t:"Match Review",xp:35,min:10,
 read:"Pros review every game. Not to beat themselves up, but to learn. Be honest and specific.",
 steps:["Write 3 things that went well in your last game.","Write 1 thing to improve.","Write 1 action you will do in training this week to improve it.","Share it with a coach or grown-up if you want to."],
 reflect:"What is your one action for this week?"},
{id:"y-t2",s:"y",p:"ment",t:"Discipline Streak",xp:30,min:5,
 read:"Discipline is doing what you said you would, even when you don't feel like it. Small daily habits build big players.",
 steps:["Pick one habit: 10 minutes of stretching, 100 touches, or being in bed on time.","Do it today.","Tell someone what your habit is.","Come back and complete this challenge tomorrow too."],
 reflect:"Which habit did you choose and why?"},
{id:"y-t3",s:"y",p:"ment",t:"Lead the Warm-Up",xp:35,min:10,
 read:"Leaders don't need the armband. Planning a warm-up shows your coach you understand the game and care about the team.",
 steps:["Plan a 5-minute warm-up: jog, dynamic stretches, then a short ball drill.","Write the order and timings.","Practise it yourself at home.","Ask your coach if you can lead it one week."],
 reflect:"How did it feel to plan for the whole team?"},
{id:"y-v1",s:"y",p:"move",t:"Scanning Drill",xp:35,min:10,
 read:"Scanning means checking over your shoulder before the ball arrives. The best midfielders scan many times every minute. Then they know where to go before they get the ball.",
 steps:["Ask someone to stand behind you and hold up fingers.","Pass the ball against a wall.","Before every return, glance over your shoulder and call out the number.","Do 3 rounds of 60 seconds."],
 reflect:"How many numbers did you get right?"},
{id:"y-v2",s:"y",p:"move",t:"Weaker Foot 100",xp:35,min:12,
 read:"A two-footed player is much harder to defend against. The only way to get there is lots of touches on your weaker foot.",
 steps:["25 inside-foot passes against a wall with your weaker foot.","25 sole rolls with your weaker foot.","25 outside-foot touches with your weaker foot.","25 keepy-ups or juggles with your weaker foot."],
 reflect:"Which skill felt hardest on your weaker foot?"},
{id:"y-v3",s:"y",p:"move",t:"Core Circuit",xp:30,min:10,
 read:"A strong core helps you hold off players, balance and shoot with power. Quality matters more than speed. Stop if anything hurts.",
 steps:["Plank: 30 seconds.","Side plank: 20 seconds each side.","Dead bugs: 10 slow reps.","Glute bridges: 12 reps.","Rest 1 minute, then do it all again."],
 reflect:"Which exercise was toughest?"},

/* ACADEMY 15–18 */
{id:"a-m1",s:"a",p:"mind",t:"Pre-Match Routine",xp:40,min:15,
 read:"A routine takes away the guesswork on match day. It gives your mind a familiar path from the night before to kick-off, so nerves turn into readiness.",

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const pad=n=>String(n).padStart(2,"0");
const dayKey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function weekKey(d=new Date()){const x=new Date(d);const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return dayKey(x)}
function yesterday(){const d=new Date();d.setDate(d.getDate()-1);return dayKey(d)}
const dayNum=()=>Math.floor(new Date(dayKey()+"T12:00:00").getTime()/864e5);
const countP=(s,p)=>s.log.filter(l=>byId[l.id]?.p===p).length;
function stageFor(age){return age<=9?"g":"d"}
function lvl(xp){let i=0;LEVELS.forEach((L,k)=>{if(xp>=L[0])i=k});const cur=LEVELS[i][0],next=LEVELS[i+1]?LEVELS[i+1][0]:null;return {i,name:LEVELS[i][1],cur,next,pct:next?(xp-cur)/(next-cur):1}}
function pitchFrac(xp){const L=lvl(xp);return (L.i+(L.next?L.pct:0))/(LEVELS.length-1)}

const KEY="b2b.player.v1";
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function fresh(){return {nick:"",age:9,stage:"d",kit:1,xp:0,week:{key:weekKey(),xp:0},done:{},log:[],lastDay:"",streak:0,best:0,hats:0,hatDay:"",badges:[]}}
let S=Object.assign(fresh(),load()||{});
let view="home", detailId=null, filterP="all", filterS=S.stage, boardMode="week", boardScope="all";

function rollWeek(){const wk=weekKey();if(S.week.key!==wk){S.week={key:wk,xp:0};save()}}
function liveStreak(){return (S.lastDay===dayKey()||S.lastDay===yesterday())?S.streak:0}
function todays3(){const n=dayNum();return ["mind","ment","move"].map(p=>{const list=C.filter(c=>c.s===S.stage&&c.p===p);return list[n%list.length]})}
const doneToday=id=>S.done[id]===dayKey();

/* ---------- shared table (db) ---------- */
let db=null, uid=null, owner=false, board=[], boardState="loading", writeErr=null, syncing=false, again=false;
(async()=>{
  try{
    if(!window.claude||typeof window.claude.use!=="function"){boardState="off";return rerenderLive()}
    const u=await window.claude.use("user");
    uid=u?await u.id():null; owner=u?await u.isOwner():false;
    db=await window.claude.use("db");
    if(!db||!uid){boardState="off";return rerenderLive()}
    db.collection("players").orderBy("xp","desc").limit(300).onSnapshot(snap=>{
      board=snap.docs.map(d=>({id:d.id,...d.data()}));boardState="live";rerenderLive();
    },()=>{boardState="off";rerenderLive()});
    if(S.nick)sync();
  }catch(e){boardState="off";rerenderLive()}
})();
function rerenderLive(){if(view==="board"||view==="home")render()}
async function sync(){
  if(!db||!uid||!S.nick)return;
  if(syncing){again=true;return}
  syncing=true;
  try{
    await db.doc("players/"+uid).set({nick:S.nick,kit:S.kit,stage:S.stage,xp:S.xp,weekKey:S.week.key,weekXp:S.week.xp,streak:liveStreak(),showcase:S.showcase===true,updated:Date.now()});
    writeErr=null;
  }catch(e){writeErr=(e&&e.code)||"unavailable";if(view==="board")render()}
  syncing=false;
  if(again){again=false;sync()}
}

/* ---------- actions ---------- */
function complete(id){
  const c=byId[id];if(!c||doneToday(id))return;
  const today=dayKey();
  rollWeek();
  let gain=c.xp;
  S.done[id]=today;
  S.log.unshift({id,day:today,xp:c.xp,feel:draft.feel[id]||"",note:(draft.note[id]||"").trim().slice(0,400)});
  S.log=S.log.slice(0,300);
  if(S.lastDay!==today){S.streak=(S.lastDay===yesterday())?S.streak+1:1;S.lastDay=today}
  S.best=Math.max(S.best||0,S.streak);
  let msg=`+${c.xp} XP`;
  if(S.hatDay!==today&&todays3().every(t=>doneToday(t.id))){S.hatDay=today;S.hats=(S.hats||0)+1;gain+=30;msg+=" · Hat-trick +30"}
  const before=lvl(S.xp).i;
  S.xp+=gain;S.week.xp+=gain;
  const newB=BADGES.filter(b=>!S.badges.includes(b.id)&&b.test(S));
  newB.forEach(b=>S.badges.push(b.id));
  if(lvl(S.xp).i>before)msg+=` · New level: ${lvl(S.xp).name}`;
  else if(newB.length)msg+=` · Badge: ${newB[0].name}`;
  delete draft.steps[id];delete draft.feel[id];delete draft.note[id];
  stopTimer();
  save();toast(msg);render();sync();
}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove("on"),2600)}
function startTimer(id){const c=byId[id];if(timer.id!==id){timer={id,left:c.min*60,running:false,h:null}}if(timer.running)return;if(timer.left<=0)timer.left=c.min*60;timer.running=true;timer.h=setInterval(()=>{timer.left--;paintTimer();if(timer.left<=0){stopTimer();paintTimer()}},1000);paintTimer()}
function stopTimer(){clearInterval(timer.h);timer.running=false;paintTimer()}
function resetTimer(id){stopTimer();timer={id,left:byId[id].min*60,running:false,h:null};paintTimer()}
function paintTimer(){const el=document.getElementById("timer-text");if(!el)return;const l=Math.max(0,timer.left);el.textContent=l<=0?"Time!":`${Math.floor(l/60)}:${pad(l%60)}`;const b=document.getElementById("timer-go");if(b)b.textContent=timer.running?"Pause":"Start"}
