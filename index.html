{id:"d-m5",s:"d",p:"mind",t:"Watch and Learn",xp:25,min:15,read:"Top players learn by watching. Choose one player in your position and watch only them for 10 minutes of a match.",steps:["Pick a match on TV or a highlights video.","Choose one player in your position.","Watch only them for 10 minutes.","Write down 3 things they did well.","Pick one to try at your next training."],reflect:"What will you copy from them?",goal:"Learning by watching good players",need:["A match to watch","Paper and pen"],tip:"Watch what they do without the ball too. Where do they run?",check:"You wrote 3 things and picked one to try.",ex:"1. Looked over their shoulder before getting the ball. 2. Passed quickly with one touch. 3. Pointed to tell teammates where to go."},
{id:"d-m6",s:"d",p:"mind",t:"Confidence Cards",xp:25,min:10,read:"Confidence comes from remembering what you are good at. Make cards to read before games.",steps:["Get 5 small pieces of card.","On each one, write something you do well in football.","On the back, write a moment when you did it.","Read them the night before your next match."],reflect:"Which card makes you feel most confident?",goal:"Building your confidence",need:["5 pieces of card","A pen"],tip:"Be specific. \"Good passer\" is OK. \"I always find the striker\" is better.",check:"You have 5 cards with a strength and a moment on each.",ex:"Front: I win headers. Back: I won every header against Riverside last month."},
{id:"d-t4",s:"d",p:"ment",t:"Effort Meter",xp:25,min:5,read:"You can't always control how well you play, but you can always control your effort. Rate it honestly.",steps:["After your next training or match, sit down for 2 minutes.","Rate your effort from 1 to 10.","Write one moment you worked really hard.","Write one moment you could have tried harder.","Set your target effort score for next time."],reflect:"What effort score will you aim for next time?",goal:"Owning your effort",need:["Paper and pen"],tip:"Be honest. Nobody else needs to see it.",check:"You rated your effort and wrote both moments.",ex:"Effort 7. Worked hard: chased back to win the ball. Could do better: stopped running after we went 2-0 down. Target: 9."},
{id:"d-t5",s:"d",p:"ment",t:"Ref Says No",xp:25,min:6,read:"Referees make mistakes, just like players. Arguing gets you in trouble and takes your focus off the game. Accept it and move on.",steps:["Think of a time you disagreed with a decision.","Write what you did.","Write what a calm player would do: deep breath, turn away, focus on the next job.","Practise saying \"Next ball\" and jogging back to position."],reflect:"How will you react next time a decision goes against you?",goal:"Staying calm with referees",need:["Paper and pen"],tip:"Let your captain or coach speak to the ref. Your job is the next ball.",check:"You wrote your plan for the next bad decision."},
{id:"d-t6",s:"d",p:"ment",t:"Champion Sleep",xp:20,min:10,read:"Your body gets stronger while you sleep. Players your age need around 9 to 11 hours a night.",steps:["Work out what time you need to wake up.","Count back 9 and a half hours. That's your bedtime.","Plan a wind-down: screens off 30 minutes before bed.","Write your bedtime routine and stick it by your bed.","Try it tonight."],reflect:"What time is your champion bedtime?",goal:"Sleeping like an athlete",need:["Paper and pen","A grown-up"],tip:"A dark, cool room helps you sleep better.",check:"Your bedtime routine is by your bed and you tried it tonight."},
/* YOUTH */
{id:"y-v4",s:"y",p:"move",t:"Open Body Receive",xp:35,min:12,read:"Receiving with an open body lets you see more of the pitch and play forward quickly. Get side-on before the ball arrives.",steps:["Stand side-on to a wall, front foot pointing away.","Pass with your front foot, receive with your back foot.","Take your first touch forward into space. 10 times.","Switch sides and repeat. 10 times.","Add a scan before every receive."],reflect:"Did your first touch go forward every time?",goal:"Receiving to play forward",need:["A ball","A wall"],tip:"Your hips decide where you can go. Open them early.",check:"Your first touch went forward on both sides."},
{id:"y-v5",s:"y",p:"move",t:"Fast Feet Ladder",xp:30,min:12,read:"Quick feet help you react, change direction and keep balance. Use chalk, tape or sticks to make a ladder on the ground.",steps:["Make a ladder of 8 squares.","One foot in each square, fast. 3 runs.","Two feet in each square. 3 runs.","In-in-out-out sideways. 3 runs.","Finish each run with a 5-metre sprint."],reflect:"Which pattern was hardest?",goal:"Quick, light feet",need:["Chalk, tape or sticks","Space"],tip:"Stay on the balls of your feet and pump your arms.",check:"You finished all 9 runs without stepping on the lines."},
{id:"y-v6",s:"y",p:"move",t:"Driven Pass",xp:35,min:12,read:"A driven pass travels fast and low to a teammate far away. Strike through the middle with your laces and follow through low.",steps:["Set a target 15 to 20 metres away.","Approach at a slight angle.","Strike through the middle with your laces, toe down. 10 passes.","Keep the ball below head height.","5 more with your weaker foot."],reflect:"How many passes stayed low and reached the target?",goal:"Passing long and low",need:["A ball","Space for 20 metres","A target"],tip:"Land on your kicking foot and keep your head over the ball.",check:"Most passes stayed below head height and reached the target."},
{id:"y-m4",s:"y",p:"mind",t:"Pressure Rehearsal",xp:30,min:10,read:"Imagining hard moments in advance means they don't feel new in a match. Picture the tough bits, and you handling them well.",steps:["Sit quietly and close your eyes.","Picture losing the ball near your own goal. See yourself recover and win it back.","Picture missing a big chance. See yourself reset and get the next one.","Picture the crowd shouting. See yourself calm and focused.","Write which picture felt most real."],reflect:"Which pressure moment do you feel ready for now?",goal:"Preparing for pressure",need:["A quiet spot","Paper and pen"],tip:"Always finish the picture with you doing the right thing.",check:"You pictured all 3 moments and wrote one down."},
{id:"y-m5",s:"y",p:"mind",t:"Process Goals",xp:35,min:10,read:"\"Win the game\" is an outcome goal. You can't fully control it. Process goals are the actions that lead there, like \"scan before every pass\". You control those.",steps:["Write one outcome goal for your next match.","Write 3 process goals that help you get there.","Make each one something you can count or check.","After the match, score each process goal out of 10."],reflect:"Which process goal matters most for you?",goal:"Setting goals you control",need:["Paper and pen"],tip:"If you can't count it, it's too vague.",check:"You have one outcome goal and 3 countable process goals.",ex:"Outcome: keep a clean sheet. Process: talk on every set piece, stay goal-side of my striker, win my first header."},
{id:"y-m6",s:"y",p:"mind",t:"Focus Through Noise",xp:30,min:8,read:"Matches are loud. Training your focus with distractions helps you stay locked in when it matters.",steps:["Do keepy-ups while someone counts random numbers out loud.","Keep your count in your head. Don't lose it.","Play 3 rounds of 60 seconds.","Then try wall passes while they try to distract you with talking."],reflect:"What helped you stay focused?",goal:"Concentration under distraction",need:["A ball","A wall","A helper"],tip:"Pick one small thing to focus on, like the ball's logo.",check:"You kept your count through all 3 rounds."},
{id:"y-t4",s:"y",p:"ment",t:"Lead by Example",xp:30,min:10,read:"You don't need the armband to lead. Leaders arrive early, work hardest, encourage others and stay calm when things go wrong.",steps:["Write 5 things a great leader does at training.","Circle the 2 you find hardest.","Plan how you'll do those 2 at your next session.","Afterwards, tick off what you managed."],reflect:"Which leadership action will you keep doing?",goal:"Leading without the armband",need:["Paper and pen"],tip:"Encouraging a teammate after their mistake is real leadership.",check:"You wrote 5 actions and planned your 2 hardest.",ex:"Arrive 10 minutes early, help set up, encourage after mistakes, keep talking when tired, stay calm when we're losing."},
{id:"y-t5",s:"y",p:"ment",t:"Recovery Routine",xp:30,min:12,read:"What you do after a game decides how you feel the next day. A short recovery routine helps your body bounce back.",steps:["Within an hour of finishing, drink water and eat a snack.","Do 5 minutes of light stretching: calves, hamstrings, quads, hips.","Have a proper meal with carbs and protein.","Get to bed on time.","Write your recovery routine so you can repeat it."],reflect:"How did you feel the next morning?",goal:"Recovering after games",need:["A water bottle","A mat"],tip:"Chocolate milk is a cheap, easy recovery drink.",check:"Your recovery routine is written down and you tried it."},
{id:"y-t6",s:"y",p:"ment",t:"Screen Swap",xp:30,min:10,read:"Phones and games aren't bad, but too much screen time eats into sleep, training and rest. Swap a little for something that helps you improve.",steps:["Check how much screen time you had yesterday.","Pick 20 minutes to swap tomorrow.","Plan what you'll do instead: touches, stretching or watching a full match.","Do the swap and write how it went."],reflect:"Was the swap easy or hard?",goal:"Managing screen time",need:["Your phone or tablet settings"],tip:"Screens off the hour before bed is the best swap of all.",check:"You did your 20-minute swap."},
/* ACADEMY */
{id:"a-v4",s:"a",p:"move",t:"Brake Training",xp:40,min:12,read:"Stopping safely is as important as running fast. Good deceleration protects your knees and lets you change direction quicker.",steps:["Warm up for 5 minutes.","Jog 10 metres and stop in 3 steps, low and balanced. 5 times.","Run 10 metres at 75% and stop in 3 steps. 5 times.","Sprint 10 metres and stop, then go back the other way. 5 times.","Cool down and stretch."],reflect:"Did your knees stay in line with your toes when you stopped?",goal:"Stopping safely and quickly",need:["Space for 15 metres"],tip:"Sink your hips and take short, quick steps to brake.",check:"You stopped balanced on every rep with knees over toes."},
{id:"a-v5",s:"a",p:"move",t:"Single-Leg Strength",xp:40,min:15,read:"Football is played on one leg at a time. Single-leg strength helps you shoot, tackle and stay injury-free. Quality before quantity.",steps:["Split squats: 3 sets of 8 each leg.","Single-leg Romanian deadlift, bodyweight: 3 sets of 8 each leg.","Single-leg calf raises: 3 sets of 12 each leg.","Rest 45 seconds between sets."],reflect:"Is one leg weaker than the other?",goal:"Strength on one leg",need:["A mat","A wall for balance"],tip:"Slow and controlled. Stop if anything hurts.",check:"You finished all sets with good balance."},
{id:"a-v6",s:"a",p:"move",t:"Press and Recover",xp:45,min:15,read:"A box-to-box midfielder presses hard then gets back into shape. This shadow drill builds that engine.",steps:["Warm up for 8 minutes.","Sprint 10 metres to press an imaginary player.","Slow down, jockey sideways for 3 seconds.","Turn and recover 15 metres back at 75%.","Rest 20 seconds. Do 8 reps."],reflect:"How did your last rep compare with your first?",goal:"Pressing and recovering repeatedly",need:["Space for 25 metres","A water bottle"],tip:"Approach the presser low and side-on, not square.",check:"You did all 8 reps with good form."},
{id:"a-m4",s:"a",p:"mind",t:"Scout Report",xp:40,min:20,read:"Academy players study the game. Watch a top midfielder and analyse them like a scout.",steps:["Watch 20 minutes of a pro match.","Pick one midfielder.","Note how often they scan before receiving.","Note where they move when their team loses the ball.","Write 2 things to bring into your game."],reflect:"What surprised you about their game?",goal:"Learning to read the game",need:["A match to watch","Paper and pen"],tip:"Watch the player, not the ball.",check:"You counted their scans and wrote 2 lessons.",ex:"Scanned about 6 times before receiving. Always sprinted back into the centre when we lost it. Lessons: scan more, recover centrally."},
{id:"a-m5",s:"a",p:"mind",t:"Confidence Bank",xp:35,min:10,read:"Confidence should come from evidence, not just how you feel. Keep a bank of proof that you are ready.",steps:["Start a note on your phone or in a notebook.","Add 5 pieces of evidence: good games, hard sessions, praise from coaches.","Add one new piece after every session this week.","Read it before your next big match."],reflect:"Which deposit in your bank means the most?",goal:"Confidence built on evidence",need:["A notebook or phone"],tip:"Hard work counts as evidence too, not just good results.",check:"Your bank has at least 5 deposits.",ex:"Ran my best 2km time. Coach said my scanning has improved. Played 90 minutes on Saturday and won 8 duels."},
{id:"a-m6",s:"a",p:"mind",t:"If-Then Plans",xp:40,min:12,read:"Pros prepare for what might go wrong. If-then plans decide your response in advance, so you don't have to think when it happens.",steps:["Write 4 tough match situations.","For each one, write: If this happens, then I will…","Keep each answer short and clear.","Read your plans before your next match."],reflect:"Which plan do you think you'll need most?",goal:"Planning your responses",need:["Paper and pen"],tip:"Keep the \"then\" part to one action.",check:"You have 4 if-then plans ready.",ex:"If I get booked, then I stay on my feet in tackles. If we concede, then I demand the ball. If I'm subbed, then I support from the bench."},
{id:"a-t4",s:"a",p:"ment",t:"Performance Plate",xp:35,min:15,read:"What you eat fuels how you train and recover. A performance plate is roughly a third carbs, a third protein and a third vegetables or fruit.",steps:["Look at your next main meal.","Check you have carbs, such as rice, pasta or potatoes.","Check you have protein, such as chicken, fish, eggs or beans.","Check you have colour: vegetables or fruit.","Plan tomorrow's meals with a grown-up."],reflect:"What was missing from your plate?",goal:"Eating like an athlete",need:["A grown-up","Paper and pen"],tip:"Eat more carbs on heavy training days.",check:"You checked one meal and planned tomorrow's."},
{id:"a-t5",s:"a",p:"ment",t:"Online Like a Pro",xp:35,min:10,read:"Scouts and clubs look at players' social media. What you post, and how you react to others, says a lot about you.",steps:["Look at your last 10 posts or comments.","Would you be happy for a coach to see them? Delete any you wouldn't.","Write 3 rules for how you'll act online.","Never reply to negative comments about your football."],reflect:"What are your 3 online rules?",goal:"Being professional online",need:["Your phone"],tip:"If you're not sure about posting something, don't.",check:"You checked your posts and wrote 3 rules.",ex:"1. Never post when angry. 2. Only positive comments about teammates. 3. Keep match criticism off social media."},
{id:"a-t6",s:"a",p:"ment",t:"Dressing Room Voice",xp:40,min:10,read:"Every dressing room has energy givers and energy takers. Being a positive voice makes you valuable to any team.",steps:["Write 3 things energy givers say or do.","Write 3 things energy takers say or do.","Be honest: which are you more often?","Plan one positive thing to say to the team before your next game."],reflect:"What will you say to the team?",goal:"Building team culture",need:["Paper and pen"],tip:"Keep it short and genuine. People can tell when it's fake.",check:"You wrote both lists and planned your team message."}
];

const C3=[
{id:"e-v1",s:"e",p:"move",t:"Plyo Power",xp:45,min:15,read:"Explosive power wins first steps, duels and headers. Plyometrics train your muscles to produce force fast. Land softly every time. Quality beats quantity.",steps:["Warm up for 8 minutes: jog, skips, leg swings.","Pogo jumps: 3 sets of 10, quick off the ground.","Broad jumps: 3 sets of 5, stick each landing for 2 seconds.","Lateral bounds: 3 sets of 6 each side, hold each landing.","Rest 60 seconds between sets."],reflect:"Which landing felt least stable?",goal:"Explosive first steps",need:["Grass or a soft surface","Space for 5 metres"],tip:"Land quietly. Loud landings mean you're not absorbing the force.",check:"You stuck every broad jump and bound landing for 2 seconds."},
{id:"e-v2",s:"e",p:"move",t:"Two-Touch Tempo",xp:45,min:15,read:"At academy level the game is fast. You need to scan, receive and play in two touches without slowing down.",steps:["Stand side-on 5 metres from a wall.","Scan over your shoulder, receive on the half-turn, pass back. Two touches only.","Do 60 seconds. Count your passes.","Rest 30 seconds. Do 4 rounds.","Try to beat your count each round."],reflect:"What made you lose the rhythm?",goal:"Playing at match tempo",need:["A ball","A wall"],tip:"Your scan happens while the ball travels, never after it arrives.",check:"You kept two-touch tempo for 4 rounds and beat your first count."},
{id:"e-v3",s:"e",p:"move",t:"Change of Pace",xp:40,min:12,read:"The best dribblers don't just go fast. They go slow, then explode. A change of pace beats defenders more than tricks do.",steps:["Dribble slowly for 5 metres with small touches.","Drop a shoulder or feint.","Explode for 10 metres with a big first touch.","Walk back. Do 8 reps, alternating feet.","Finish with 4 reps using only your weaker foot."],reflect:"Did your explosion touch go far enough to escape?",goal:"Beating players with pace changes",need:["A ball","Space for 20 metres"],tip:"Make the slow part really slow. The contrast is what fools defenders.",check:"Every rep had a clear slow-then-fast change."},
{id:"e-v4",s:"e",p:"move",t:"Tired Legs Finishing",xp:45,min:15,read:"Late in games your legs are heavy but chances still come. Practise finishing when you're tired.",steps:["Set up a goal or target.","Sprint 20 metres, turn, and dribble back towards goal.","Finish with one touch to set, one to shoot.","Do 10 reps, alternating feet.","Count how many hit the target."],reflect:"Did your technique hold up when you were tired?",goal:"Composure when fatigued",need:["A ball","A goal or target","Space for 20 metres"],tip:"Slow your mind down before the shot, even when your legs are fast.",check:"You finished all 10 reps and counted your hits."},
{id:"e-v5",s:"e",p:"move",t:"Hamstring Shield",xp:40,min:12,read:"Hamstring and groin injuries are common in football. These two exercises are proven to reduce them. Go slowly and stop if anything hurts.",steps:["Nordic curls: kneel with a partner holding your ankles. Lower forwards as slowly as you can. 3 sets of 5.","Copenhagen plank: side plank with your top leg on a bench. 3 sets of 15 seconds each side.","If Copenhagen is too hard, bend your top knee on the bench.","Stretch your hamstrings and groin gently afterwards."],reflect:"How far could you lower in the Nordic curl?",goal:"Protecting against injury",need:["A partner","A mat","A low bench or sofa"],tip:"In the Nordic, keep your hips straight. Don't bend at the waist.",check:"You finished all sets with control."},
{id:"e-v6",s:"e",p:"move",t:"Shield and Spin",xp:40,min:12,read:"Holding the ball under pressure lets your team move up. Get your body between the defender and the ball, then spin away.",steps:["Ask a partner to stand behind you as a defender.","Receive the ball and shield it for 5 seconds, keeping them on your back.","Use your arm for distance, not to push.","Spin away on the side they don't cover.","Do 10 reps, swapping sides."],reflect:"Which side do you spin to more naturally?",goal:"Holding the ball under pressure",need:["A ball","A partner"],tip:"Low centre of gravity, wide base, ball on your far foot.",check:"You held the ball for 5 seconds and spun away on most reps."},
{id:"e-m1",s:"e",p:"mind",t:"Self-Scout",xp:45,min:20,read:"Academy players review their own footage. Watching yourself shows things you never notice on the pitch.",steps:["Get a video of you playing: a match clip or training.","Watch 5 minutes, only watching yourself.","Note every time you scanned before receiving.","Note one great moment and one you'd do differently.","Write one thing to focus on next session."],reflect:"What did the video show that surprised you?",goal:"Analysing your own game",need:["A video of you playing","Paper and pen"],tip:"Watch without the ball too. Your movement off the ball tells the story.",check:"You noted your scans, a great moment, one to change and a focus.",ex:"Scanned 3 times in 5 minutes, too few. Great: through ball at 2:10. Change: stopped running after losing the ball. Focus: scan before every receive."},
{id:"e-m2",s:"e",p:"mind",t:"Find Your Zone",xp:40,min:12,read:"Every player has an ideal level of energy before a game. Too flat and you're slow. Too wired and you rush. Learn where your zone is.",steps:["Think of your best ever game. Rate how energised you felt from 1 to 10.","Think of a poor game. Rate it too.","Your best number is your zone.","Write 2 ways to raise your energy: music, sharp movements.","Write 2 ways to lower it: box breathing, slow stretching."],reflect:"What number is your zone?",goal:"Controlling your match energy",need:["Paper and pen"],tip:"Check your number in the warm-up and adjust before kick-off.",check:"You know your zone number and have 2 ways up and 2 ways down.",ex:"Zone: 7. Up: hype playlist, quick feet drills. Down: box breathing, slow walk."},
{id:"e-m3",s:"e",p:"mind",t:"Pressure Is a Privilege",xp:40,min:10,read:"Nerves and excitement feel the same in your body: fast heart, butterflies. Telling yourself \"I'm excited\" instead of \"I'm nervous\" helps you perform.",steps:["Think of your next big game.","Notice how your body feels when you picture it.","Say out loud: \"I'm excited. This matters to me.\"","Write why being in this game is a privilege.","Use the line in your next warm-up."],reflect:"Did changing the words change how you felt?",goal:"Turning nerves into energy",need:["Paper and pen"],tip:"You only get nervous about things you care about. That's a good sign.",check:"You wrote why it's a privilege and have your line ready."},
{id:"e-m4",s:"e",p:"mind",t:"Decision Lab",xp:45,min:15,read:"Game intelligence means choosing the best option fast. Train it by thinking through situations before they happen.",steps:["Situation 1: you receive in midfield, a defender is closing from behind. What do you do?","Situation 2: your team just lost the ball high up the pitch. Where do you go?","Situation 3: 1-0 up, 85th minute, you have the ball in the corner. What's the smart play?","Situation 4: your striker is making a run but is marked. Pass or keep it?","Write your answer for each, then ask a coach for theirs."],reflect:"Which answer did your coach see differently?",goal:"Making smart decisions faster",need:["Paper and pen","A coach to ask"],tip:"There's rarely one right answer. Explain why you chose yours.",check:"You answered all 4 and compared with a coach.",ex:"1: one-touch pass back and spin. 2: press the nearest player straight away. 3: keep it in the corner and win a throw. 4: keep it and wait for a better run."},
{id:"e-m5",s:"e",p:"mind",t:"Season Map",xp:40,min:20,read:"Pro players plan their season. Big goals, broken into blocks, reviewed often.",steps:["Write your big goal for this season.","Split the season into 3 blocks.","Write one focus for each block.","Choose a date for each review.","Share it with your coach."],reflect:"What's your focus for this block?",goal:"Planning your season",need:["Paper and pen"],tip:"Put review dates in your calendar now.",check:"Your season map has a goal, 3 blocks, 3 focuses and review dates.",ex:"Goal: earn a scholarship. Block 1: weaker foot. Block 2: strength. Block 3: decision-making. Reviews: Dec, Mar, May."},
{id:"e-m6",s:"e",p:"mind",t:"The Full 90",xp:45,min:15,read:"Elite players picture the whole match before they play it: the warm-up, the first touch, tough moments and the final whistle.",steps:["Sit quietly, eyes closed.","Picture arriving and your warm-up. Feel sharp.","Picture your first three touches, all clean.","Picture a mistake, then your reset and next action.","Picture the last 10 minutes: you're still working hard.","Picture the final whistle and how you want to feel."],reflect:"Which part was hardest to picture clearly?",goal:"Preparing your mind for the whole match",need:["A quiet spot"],tip:"See it through your own eyes, at real speed.",check:"You pictured all 5 moments in detail."},
{id:"e-t1",s:"e",p:"ment",t:"Your Development Plan",xp:45,min:20,read:"Academies use individual development plans. Owning yours shows coaches you take your growth seriously.",steps:["Write your 3 biggest strengths.","Write 2 areas to develop.","For each area, write one action you'll do every week.","Book 5 minutes with your coach to agree it.","Review it every 6 weeks."],reflect:"What did your coach add to your plan?",goal:"Owning your development",need:["Paper and pen","Your coach"],tip:"Make actions specific and repeatable, like \"200 weaker-foot touches on Tuesdays\".",check:"Your plan has strengths, 2 areas, weekly actions and a coach chat booked.",ex:"Strengths: passing range, work rate, communication. Develop: heading, 1v1 defending. Actions: 1v1 practice Thursdays, extra strength work Mondays."},
{id:"e-t2",s:"e",p:"ment",t:"Plan A and Plan B",xp:40,min:15,read:"Most academy players don't become professionals, and that's normal. The best keep their education strong so every door stays open, in football and outside it.",steps:["Write your Plan A: your football goal.","Write your Plan B: another career you'd enjoy, in or out of football.","Write what you need at school or college for Plan B.","Write how you'll keep your studies on track this term."],reflect:"How does having a Plan B make you feel about Plan A?",goal:"Protecting your future",need:["Paper and pen"],tip:"Coaching, physio, analysis and sports science are all careers in football.",check:"You wrote both plans and your study plan."},
{id:"e-t3",s:"e",p:"ment",t:"Load Diary",xp:40,min:10,read:"Too much training without recovery leads to injury. Pros track their load. Do it for a week.",steps:["Every day this week, rate your training effort from 1 to 10.","Write how many minutes you trained.","Rate your sleep and soreness from 1 to 10.","At the end of the week, look for patterns.","Share it with your coach if something worries you.","Set a limit: if your weekly load score jumps more than 30% in one week, plan an easier week next."],reflect:"What pattern did you notice?",goal:"Managing your training load",need:["A notebook or phone"],tip:"Effort times minutes gives you a load score for each session.",check:"You logged today's training, sleep and soreness."},

function targets(id,age){
  if(id==="sprint"){
    if(age<9)return null;
    if(age===9)return {g:SPRINT20[9][2]};
    const r=SPRINT20[Math.min(age,17)];return {d:r[3],y:r[2],a:r[1],e:r[0]};
  }
  const t=TECH[id];return age<=9?{g:t.g}:{d:t.d,y:t.y,a:t.a,e:t.e};
}
function meets(test,v,target){return test.lower?v<=target:v>=target}
function levelReached(test,v,age){
  const T=targets(test.id,age);if(!T||v==null)return undefined;
  const order=age<=9?["g"]:["e","a","y","d"];
  for(const k of order)if(T[k]!=null&&meets(test,v,T[k]))return k;
  return null;
}
function pb(id){const L=(S.tests&&S.tests[id])||[];if(!L.length)return null;const t=TESTS.find(x=>x.id===id);return L.reduce((b,x)=>b==null?x.v:(t.lower?Math.min(b,x.v):Math.max(b,x.v)),null)}

function overall(){
  const age=S.age,res=TESTS.map(t=>levelReached(t,pb(t.id),age)).filter(x=>x!==undefined);
  if(!res.length)return null;
  if(age<=9){const ok=res.filter(x=>x==="g").length;return {mini:true,ok,n:res.length}}
  const idx=res.map(x=>x?LVK.indexOf(x):0).sort((a,b)=>a-b);

  return {k:med?LVK[med]:null,n:res.length};
}

function drillDone(id){
  const today=dayKey();S.drillDay=S.drillDay||{};
  if(S.drillDay[id]===today){toast("Done today. Come back tomorrow for more XP.");return}
  S.drillDay[id]=today;rollWeek();
  if(S.lastDay!==today){S.streak=(S.lastDay===yesterday())?S.streak+1:1;S.lastDay=today}S.best=Math.max(S.best||0,S.streak);
  S.xp+=10;S.week.xp+=10;save();sync();toast("+10 XP");soft();
}

function buildFuelPlan(q){
  const bad=new Set(q.avoid.flatMap(a=>AVOID_RULES[a]||[]));
  const B=BUDGETS[q.budget]||BUDGETS.standard;
  const ok=m=>!m.ct.some(t=>bad.has(t))&&(q.fussy!=="2"||m.e===1);
  const pool=slot=>{
    const list=FM.filter(m=>m.slot===slot&&ok(m)).map(m=>{
      let sc=m.likes.filter(l=>q.likes.includes(l)).length*10;
      if(q.cuisines.includes(m.c))sc+=10;
      if(q.fussy==="1"&&m.e)sc+=5;
      sc-=m.cost*B.pen;
      return {m,sc};
    });
    list.sort((a,b)=>b.sc-a.sc||a.m.id.localeCompare(b.m.id));
    return list.map(x=>x.m);
  };
  const cache={};
  const pick=(slot,di,k)=>{cache[slot]=cache[slot]||pool(slot);const L=cache[slot];if(!L.length)return null;const top=L.slice(0,Math.min(4,L.length));return top[(di+k)%top.length]};
  const TYPE_SLOTS={Match:[["b","Breakfast","Start the day with carbs and some protein."],["p","Pre-match meal","Eat 2 to 3 hours before kick-off. Carbs, a little protein, low in fat."],["ps","Pre-match snack","About an hour before kick-off. Small and easy to digest."],["po","After the game","Within an hour. Carbs and protein to start recovery."],["d","Dinner","A normal, balanced evening meal."]],

   Rest:[["b","Breakfast","A balanced start."],["l","Lunch","Colour and protein."],["s","Snack","Something small between meals."],["d","Dinner","A home-cooked meal to finish the day."]]};
  const days=FUEL_DAYS.map((name,di)=>{
    const type=q.sched[di]||"Rest";
    const meals=TYPE_SLOTS[type].map(([slot,label,when],k)=>({label,when,m:pick(slot,di,k)}));
    const cost=meals.reduce((t,x)=>t+(x.m?x.m.cost:0),0);
    return {name,type,meals,cost,missing:meals.some(x=>!x.m)};
  });
  // shopping list: each ingredient counted once per serving across the week
  const shop={};
  days.forEach(d=>d.meals.forEach(x=>{if(x.m)x.m.ing.forEach(k=>{shop[k]=(shop[k]||0)+1})}));
  const total=days.reduce((t,d)=>t+d.cost,0);

const SQUAD_TARGET=1500;
const CHAL_IDS=BASICS.map(d=>d.id).filter(id=>BM[id]&&BM[id].t);
function weeklyChal(){const wk=weekKey();let h=0;for(const ch of wk)h=(h*31+ch.charCodeAt(0))%100000;const id=CHAL_IDS[h%CHAL_IDS.length];return {id,d:ALLDRILLS[id],key:wk}}
BADGES.push({id:"weekwin",name:"Week Winner",desc:"Beat your best in the weekly challenge",test:s=>(s.weekWins||[]).length>=1});
const _logScoreW=logScore;
logScore=function(id){
  const wk=weekKey(),pre=dPB(id),n0=((S.scores||{})[id]||[]).length,W=weeklyChal();
  const r=_logScoreW(id);
  const n1=((S.scores||{})[id]||[]).length;
  if(W.id===id&&n1>n0&&pre!=null&&!(S.weekly&&S.weekly.key===wk)){
    const post=dPB(id),better=BM[id].lower?post<pre:post>pre;
    if(better){S.xp+=50;S.week.xp+=50;S.weekly={key:wk,won:true};S.weekWins=[...(S.weekWins||[]),wk].slice(-52);save();toast("Weekly challenge won! +50 XP");render()}
  }
  return r};
function weeklyBlock(){
  const wk=weekKey(),W=weeklyChal(),b=BM[W.id],won=S.weekly&&S.weekly.key===wk&&S.weekly.won,best=dPB(W.id);
  const rows=boardState==="live"?board.filter(r=>r.weekKey===wk):[];
  const squad=rows.reduce((a,r)=>a+(r.weekXp||0),0)+(boardState==="live"?0:S.week.xp);
  const pct=Math.min(100,Math.round(squad/SQUAD_TARGET*100));
  const left=Math.max(0,SQUAD_TARGET-squad);
  return `<section class="sec"><div class="sechd"><div class="stack"><span class="eyebrow">This week</span><h2>Weekly challenge</h2></div></div>
   <div class="wkchal ${won?"won":""}">
    <div class="stack" style="gap:6px"><span class="eyebrow" style="color:var(--volt)">${won?"Won this week":"Beat your best · +50 XP · Week Winner badge"}</span><b style="font-size:1.1rem">${esc(W.d.t)}</b><span class="small">Target ${fmtS(b,b.t[S.stage])}${b.lower?"":" "+esc(b.unit)}${best!=null?` · your best ${fmtS(b,best)}`:""}</span></div>
    <button class="btn small" style="background:var(--volt);color:var(--on-volt);box-shadow:none" data-act="godrill" data-id="${W.id}" data-t="basics">${won?"Keep going":"Have a go"} ${ARROW}</button>
   </div>
   <div class="squad">
    <div class="sechd" style="margin-bottom:8px"><div class="stack"><span class="eyebrow">Squad goal</span><b>${squad.toLocaleString()} / ${SQUAD_TARGET.toLocaleString()} XP this week</b></div></div>
    <div class="sqbar"><i style="width:${pct}%"></i></div>
    <span class="small">${pct>=100?"Squad goal reached. Brilliant teamwork.":boardState==="live"?`${left.toLocaleString()} XP to go. Every session counts.`:"Sign in to the Table to add your squad's XP together."}</span>
   </div></section>`;
}

const NN_DEF={train:["Arrive on time","Full effort in every drill","Warm up before, cool down after","Water, food and sleep sorted","Ask one good question"],game:["Warm up for the full 15 minutes","Shake hands with the ref and both teams","Reset in 5 seconds after a mistake","Track back when we lose the ball","Thank your teammates and coach"]};

function dAll(){S.diary=S.diary||{train:[],game:[]};S.diary.train=S.diary.train||[];S.diary.game=S.diary.game||[];return S.diary}

function dNew(kind){const D=dAll();const e={id:"j"+Date.now(),kind,d:dayKey(),title:"",targets:[],nn:NN_DEF[kind].map(t=>({t,ok:false})),note:"",bonus:false};D[kind].unshift(e);D[kind]=D[kind].slice(0,40);save();render()}
function dDone(e){return e.nn.length>0&&e.nn.every(x=>x.ok)}
function dCheckBonus(e){if(dDone(e)&&!e.bonus){e.bonus=true;S.xp+=20;S.week.xp+=20;toast("All non-negotiables kept! +20 XP")}}

const CHAL_PK={move:"Movement",mind:"Mindset",ment:"Mentality"};
function chalDone(c){return !!(S.chal||{})[c.id]}
function chalCard(c){
  const col=PK[c.p].col,k=S.stage,done=chalDone(c);
  return `<details class="jcard" style="--c:${col}" ${openChal===c.id?"open":""}><summary style="cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center"><div class="stack" style="gap:4px;min-width:0"><span class="eyebrow" style="color:var(--c)">${STAGES[k].name} · ${done?"Done":"To do"}</span><b>${esc(c.t)}</b><span class="small" style="color:var(--ink)">${esc(c.lv[k])}</span></div><span class="plus" aria-hidden="true">+</span></summary>
   <div style="margin-top:12px"><p class="small">${esc(c.why)}</p><p class="small" style="color:var(--ink)"><b>Effort ${INT[k].rpe}.</b> ${esc(INT[k].focus)}</p>
    <div class="row" style="margin-top:12px"><button class="btn small" ${done?"disabled":""} style="${done?"":"background:var(--volt);color:var(--on-volt);box-shadow:none"}" data-act="chdone" data-id="${c.id}">${done?"Done":"Mark done · +25 XP"}</button></div>
   </div></details>`;
}
let openChal=null;
let chalPillar="move";
function chalSection(r,p){
  const all=CHAL.filter(c=>c.r===r);
  const pick=p||chalPillar;
  const list=all.filter(c=>c.p===pick);
  const doneAll=all.filter(chalDone).length;
  const tabs=p?"":`<div class="utabs" role="group" aria-label="Challenge type" style="margin-top:4px">${["move","mind","ment"].map(k=>{const L=all.filter(c=>c.p===k);return `<button data-act="chp" data-v="${k}" aria-pressed="${pick===k}">${CHAL_PK[k]} <span class="small">${L.filter(chalDone).length}/${L.length}</span></button>`}).join("")}</div>`;
  return `<section class="sec"><div class="sechd"><div class="stack"><span class="eyebrow">${doneAll} of ${all.length} done</span><h2>${CHAL_PK[pick]}</h2></div></div>${tabs}<div style="margin-top:12px">${list.map(chalCard).join("")}</div></section>`;
}
function routeCount(r){const L=CHAL.filter(c=>c.r===r);return {done:L.filter(chalDone).length,total:L.length}}
document.addEventListener("click",e=>{
  const pb=e.target.closest('[data-act="chp"]');if(pb){chalPillar=pb.dataset.v;render();window.scrollTo(0,0);return}
  const b=e.target.closest('[data-act="chdone"]');if(!b)return;
  const c=CHAL.find(x=>x.id===b.dataset.id);if(!c||chalDone(c))return;
  S.chal=S.chal||{};S.chal[c.id]=dayKey();S.xp+=25;S.week.xp+=25;save();toast("Challenge done! +25 XP");openChal=c.id;render();
});

/* ---- Show Us challenge, Clip of the week and opt-in Showcase (nicknames only, parental consent) ---- */
const CLUB_EMAIL="";   /* set to the club's private upload address, e.g. "shows@yourclub.example" */
const clipKey=wk=>"clip_"+(wk||weekKey());
function clipWinner(){const c=calibMap[clipKey()];return c&&c.nick?c:null}
function claimClip(){
  const w=clipWinner(),wk=weekKey();
  if(!w||!cuid||w.uid!==cuid)return;
  S.clipClaimed=S.clipClaimed||{};if(S.clipClaimed[wk])return;
  S.clipClaimed[wk]=true;S.xp+=100;S.week.xp+=100;S.weekWins=[...(S.weekWins||[]),wk].slice(-52);save();
  toast("You're clip of the week! +100 XP");
}
function showUsBlock(){
  const wk=weekKey(),w=clipWinner(),mail=CLUB_EMAIL?`mailto:${CLUB_EMAIL}?subject=${encodeURIComponent("Show Us: "+S.nick+" ("+wk+")")}&body=${encodeURIComponent("Clip for this week's challenge. A parent or carer is sending this for under-13s. Please keep it private. Nicknames only.")}`:"";
  return `<section class="sec"><div class="sechd"><div class="stack"><span class="eyebrow">Show Us</span><h2>Send us your clip</h2></div></div>
   <div class="squad"><p class="small" style="margin:0 0 10px">Film yourself doing this week's challenge and send it privately. Nothing is posted publicly, and only nicknames appear in the app.</p>
    ${mail?`<a class="btn small" style="background:var(--volt);color:var(--on-volt);box-shadow:none;display:inline-block;text-decoration:none" href="${mail}">Send my clip</a>`:`<span class="small">Ask your coach for the private upload link.</span>`}
    ${w?`<div style="margin-top:14px"><span class="eyebrow" style="color:var(--volt)">Clip of the week</span><p style="margin:6px 0 0"><b>${esc(w.nick)}</b></p></div>`:""}
   </div></section>`;
}
const _wbS=weeklyBlock;
weeklyBlock=function(){claimClip();return _wbS()+showUsBlock()};
/* opt-in showcase on the Table page */
function showcaseBlock(){
  const on=S.showcase===true;
  const rows=boardState==="live"?board.filter(r=>r.showcase===true):[];
  return `<section class="sec"><div class="sechd"><div class="stack"><span class="eyebrow">Showcase</span><h2>Players in the showcase</h2></div></div>
   <div class="squad"><p class="small" style="margin:0 0 10px">Only nicknames are shown, with no photos. Under-18s need a parent or carer to switch this on.</p>
    <button class="btn small" data-act="showtog" style="${on?"":"background:var(--volt);color:var(--on-volt);box-shadow:none"}">${on?"Leave the showcase":"Join the showcase"}</button>
    ${boardState!=="live"?`<p class="small" style="margin-top:12px">Sign in to the Table to see the showcase.</p>`:rows.length?`<div class="list" style="margin-top:12px">${rows.map(r=>`<div class="lrow"><b>${esc(r.nick||"Player")}</b><span class="small">${STAGES[r.stage]?STAGES[r.stage].name:""}</span></div>`).join("")}</div>`:`<p class="small" style="margin-top:12px">No one has joined yet.</p>`}
   </div></section>`;
}
const _vbS=viewBoard;
viewBoard=function(){const h=_vbS();const i=h.lastIndexOf('</div>');return i<0?h:h.slice(0,i)+showcaseBlock()+h.slice(i)};
/* coach picks the Clip of the week */
const _vcS=viewCoach;
viewCoach=function(){
  if(!isAdmin)return _vcS();
  const h=_vcS();
  const rows=boardState==="live"?board.filter(r=>r.showcase===true):[];
  const opts=rows.map(r=>`<option value="${esc(r.id)}">${esc(r.nick||"Player")}</option>`).join("");
  const cur=clipWinner();
  const blk=`<section class="sec"><div class="sechd"><div class="stack"><span class="eyebrow">Show Us</span><h2>Clip of the week</h2></div></div>
   <div class="squad">${cur?`<p class="small" style="margin:0 0 10px">Current winner: <b>${esc(cur.nick)}</b></p>`:""}
    ${boardState==="live"&&rows.length?`<label class="field" for="clip-pick" style="max-width:420px">Winner this week<select id="clip-pick">${opts}</select></label>
    <button class="btn small" style="margin-top:12px;background:var(--volt);color:var(--on-volt);box-shadow:none" data-act="clipset">Set winner</button>`:`<p class="small">Sign in and wait for players to join the table to pick a winner.</p>`}
   </div></section>`;
  const i=h.lastIndexOf('</div>');return i<0?h+blk:h.slice(0,i)+blk+h.slice(i);
};
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="showtog"){S.showcase=!(S.showcase===true);save();sync();render()}
  else if(a==="clipset"&&cdb){const sel=document.getElementById("clip-pick");const r=board.find(x=>x.id===(sel&&sel.value));if(!r)return;
    cdb.doc("calib/"+clipKey()).set({nick:r.nick||"Player",uid:r.id,week:weekKey(),updated:Date.now()}).then(()=>toast("Winner saved")).catch(()=>toast("Couldn't save. Check you have edit access."))}
});

/* ---- front sign-in: parents (email link) and players (profile on this device) ---- */
const API_BASE="https://box-to-box-api.craiigbrown2304.workers.dev";
let gateMode=null, gateMsg="", ACCT=null;
function sessGet(){try{return localStorage.getItem("b2b.session")}catch(e){return null}}
function sessSet(t){try{if(t)localStorage.setItem("b2b.session",t);else localStorage.removeItem("b2b.session")}catch(e){}}
function captureSession(){const m=location.hash.match(/session=([0-9a-f]{64})/);if(m){sessSet(m[1]);history.replaceState(null,"",location.pathname+location.search)}}
async function loadAccount(){const t=sessGet();if(!t){ACCT=null;return}try{const r=await fetch(API_BASE+"/api/me",{headers:{Authorization:"Bearer "+t}});if(r.status===401){sessSet(null);ACCT=null;return}ACCT=await r.json()}catch(e){ACCT=null}}
function viewGate(){
  let inner;
  if(ACCT){
    inner=`<p class="lead">Signed in as <strong>${esc(ACCT.parent.email)}</strong>.</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" data-act="gate-player">Set up a player ${ARROW}</button><button class="more" data-act="gate-signout">Sign out</button></div>`;
  }else if(gateMode==="parent"){
    inner=`<p class="lead">Enter your email and we'll send you a sign-in link. It works once and expires in 15 minutes.</p>
      <label class="small" for="gemail">Parent or guardian email</label>
      <input id="gemail" type="email" autocomplete="email" placeholder="you@example.com" style="max-width:360px;padding:12px;font:inherit">
      <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" data-act="gate-send">Email me a link ${ARROW}</button><button class="more" data-act="gate-back">Back</button></div>
      ${gateMsg?`<p class="small" role="status">${esc(gateMsg)}</p>`:""}`;
  }else{
    inner=`<p class="lead">Parents sign in with an email link. Players start their profile here, then train from the app.</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" data-act="gate-parent">I'm a parent or guardian ${ARROW}</button><button class="more" data-act="gate-player">I'm a player ${ARROW}</button></div>`;
  }
  return `<section class="hero"><div class="bgword" aria-hidden="true">Box to box</div><div class="wrap"><div class="stack" style="gap:22px">
    <span class="eyebrow">Mini soccer to academy · Ages 5–18</span>
    <h1>Sign <em class="v">in.</em></h1>${inner}</div></div></section>`;
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="gate-parent"){gateMode="parent";gateMsg="";render()}
  else if(a==="gate-player"){gateMode="player";render()}
  else if(a==="gate-back"){gateMode=null;gateMsg="";render()}
  else if(a==="gate-signout"){sessSet(null);ACCT=null;gateMode=null;render()}
  else if(a==="gate-send"){
    const em=(document.getElementById("gemail")?.value||"").trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){gateMsg="Enter a valid email address.";render();return}
    gateMsg="Sending…";render();
    try{const r=await fetch(API_BASE+"/api/auth/request",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:em})});
      gateMsg=r.ok?"Check your inbox (and spam) for a sign-in link.":"Something went wrong. Please try again."}
    catch(err){gateMsg="Couldn't reach the sign-in service. Check your connection and try again."}
    render();
  }
});
captureSession();booted=true;render();loadAccount().then(()=>{if(!S.nick)render()});
</script>
