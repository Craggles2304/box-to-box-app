<meta name="claude:viewport-fit-sides" content="cover">
<style>@font-face{font-family:"Anton";src:url(../fonts/Anton.ttf) format("truetype");font-display:swap}@font-face{font-family:"Barlow";src:url(../fonts/Barlow.ttf) format("truetype");font-weight:400 600;font-display:swap}@font-face{font-family:"Barlow Condensed";src:url(../fonts/BarlowCondensed.ttf) format("truetype");font-weight:600 700;font-display:swap}</style>
<style>
/* Layout: a single phone-shaped app shell — sticky brand bar, one scrolling view, role-built tab bar pinned to the bottom. */
:root{
  --bg:#0A0A0A; --surface:#141414; --surface2:#1C1C1C;
  --line:#222222; --line2:#2A2A2A;
  --ink:#FFFFFF; --soft:#D6D6D6; --muted:#8E8E8E;
  --lime:#C8FF00; --on-lime:#0A0A0A; --lime-dim:#1A1E0C; --lime-line:#3F4A1E;
  --display:"Anton","Arial Narrow",sans-serif;
  --head:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-card:16px; --r-row:12px; --r-pill:100px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
svg{display:block}

.app{height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:860px){
  .app{max-width:420px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* brand bar */
.top{flex:none;border-bottom:1px solid var(--line);background:var(--bg)}
.top .bar{display:flex;align-items:center;gap:10px;padding-block:11px;min-height:56px}
.logo{flex:none;width:26px;height:26px;border-radius:6px;background:var(--lime);display:grid;place-items:center;font:700 11px/1 var(--head);color:var(--on-lime);letter-spacing:.02em}
.wordmark{font:700 12px/1 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.grow{flex-grow:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:700 12px/1 var(--head);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.chip.lime{background:var(--lime-dim);border-color:var(--lime-line);color:var(--lime)}
.iconbtn{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:var(--r-pill);border:1px solid var(--line2);background:var(--surface);cursor:pointer;color:var(--ink)}
.backbtn{flex:none;display:grid;place-items:center;width:32px;height:32px;margin-left:-6px;border:0;background:none;cursor:pointer;color:var(--ink)}

/* role switch */
.roles{display:flex;gap:4px;padding-bottom:10px;overflow-x:auto;scrollbar-width:none}
.roles::-webkit-scrollbar{display:none}
.roles button{flex:none;height:28px;padding:0 11px;border-radius:var(--r-pill);border:1px solid var(--line2);background:var(--surface);color:var(--muted);font:700 11px/1 var(--head);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.roles button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.roles .lab{display:flex;align-items:center;font:700 10px/1 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-right:4px}

/* view */
main{flex-grow:1;overflow-y:auto;overscroll-behavior:contain}
.view{display:flex;flex-direction:column;gap:18px;padding-block:14px 28px}
.title .eyebrow{display:block;font:700 11px/1 var(--head);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.title h1{margin-top:4px;font:400 clamp(34px,11vw,46px)/.94 var(--display);text-transform:uppercase}
.title p{margin-top:8px;font-size:14px;line-height:1.45;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card)}
.row{display:flex;align-items:center;gap:12px;padding:13px 15px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-row)}
.row.lit{background:var(--lime-dim);border-color:var(--lime-line)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>header{display:flex;align-items:baseline;gap:8px}
.sec h2{flex-grow:1;font:700 13px/1 var(--head);letter-spacing:.18em;text-transform:uppercase}
.sec header span{font-size:12px;font-weight:600;color:var(--muted)}
.kicker{display:block;font:700 11px/1 var(--head);letter-spacing:.18em;text-transform:uppercase;color:var(--lime)}
.sub{font-size:13px;color:var(--muted)}
.big{font:400 1em/1 var(--display)}
.tnum{font-variant-numeric:tabular-nums}

.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;min-height:48px;border-radius:var(--r-pill);border:0;background:var(--lime);color:var(--on-lime);font:700 13px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;border:1px solid #3A3A3A;color:var(--ink)}
.btn.sm{min-height:38px;padding:0 14px;width:auto;font-size:12px}
.btn[disabled]{opacity:.5;cursor:default}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.tiles.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{padding:14px;border-radius:var(--r-row);background:var(--surface);border:1px solid var(--line)}
.tile.lit{background:var(--lime-dim);border-color:var(--lime-line)}
.tile b{display:block;font:400 30px/1 var(--display)}
.tile.lit b{color:var(--lime)}
.tile span{display:block;margin-top:5px;font:700 11px/1.2 var(--head);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.tile.lit span{color:var(--lime)}

.track{display:grid;gap:4px;grid-auto-flow:column;grid-auto-columns:1fr}
.track i{height:5px;border-radius:var(--r-pill);background:#262626}
.track i.on{background:var(--lime)}
.bar{height:5px;border-radius:var(--r-pill);background:#262626;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);border-radius:var(--r-pill);transition:width .35s ease}

.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;height:28px;padding:0 11px;border-radius:var(--r-pill);background:var(--surface2);border:1px solid var(--line2);font-size:13px;font-weight:600;color:var(--soft)}
.tag.lime{background:var(--lime-dim);border-color:var(--lime-line);color:var(--lime)}
.dot{flex:none;width:8px;height:8px;border-radius:var(--r-pill);background:var(--lime)}
.dot.off{background:transparent;border:2px solid var(--ink)}
.dot.dim{background:var(--muted)}
.av{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:var(--r-pill);background:var(--surface2);border:2px solid var(--line2);font:700 18px/1 var(--head)}
.av.on{border-color:var(--lime);color:var(--lime)}

.scroller{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.scroller::-webkit-scrollbar{display:none}

/* sub tabs */
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.subtabs button{flex:1;padding:0 4px 10px;border:0;background:none;color:var(--muted);font:700 12px/1 var(--head);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs button[aria-selected="true"]{color:var(--lime);border-bottom-color:var(--lime)}

/* pitch */
.pitch{position:relative;height:178px;border-radius:8px;background:#101510;border:1px solid #243024;overflow:hidden}
.pitch .ln{position:absolute;background:#243024}
.pitch .pl{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;width:23px;height:23px;border-radius:var(--r-pill);background:var(--lime);color:var(--on-lime);font:700 11px/1 var(--head)}
.pitch .pl.gk{background:var(--ink)}

/* map */
.map{flex:none;position:relative;width:48px;height:48px;border-radius:10px;background:#101510;border:1px solid #243024;overflow:hidden}
.map i{position:absolute;background:#243024}
.map svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}

/* tab bar */
.tabbar{flex:none;border-top:1px solid var(--line);background:var(--bg)}
.tabbar .inner{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;min-height:74px}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:0;border:0;background:none;color:var(--muted);cursor:pointer;padding:6px 2px}
.tabbar button[aria-current="page"]{color:var(--lime)}
.tabbar span{font:700 10px/1 var(--head);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* sheet */
.scrim{position:fixed;inset:0;background:#000A;z-index:40}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;z-index:41;background:#141A14;border:1px solid var(--lime-line);border-bottom:0;border-radius:22px 22px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:76%;overflow:auto}
.sheet header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet h2{flex-grow:1;font:400 24px/1 var(--display);text-transform:uppercase}
.sheet .links{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.sheet .links button{display:flex;align-items:center;gap:9px;min-height:60px;padding:12px;border-radius:var(--r-row);background:var(--surface2);border:1px solid var(--line2);color:var(--ink);font:700 13px/1.15 var(--head);letter-spacing:.06em;text-transform:uppercase;text-align:left;cursor:pointer}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--lime);color:var(--on-lime);padding:11px 18px;border-radius:var(--r-pill);font:700 13px/1 var(--head);letter-spacing:.08em;text-transform:uppercase;box-shadow:0 10px 30px #0008}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  /* ---------- sheet ---------- */
  function openSheet(kind) {
    var sheet = document.getElementById("sheet"), scrim = document.getElementById("scrim");
    var h;
    if (kind === "team") {
      h = '<header><h2>Team</h2><button class="iconbtn" data-close="1" aria-label="Close">' +
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button></header>' +
        '<div class="links">' + TEAMS.map(function (t) {
          return '<button data-pickteam="' + t.id + '"' + (t.id === state.team ? ' style="border-color:var(--lime);color:var(--lime)"' : "") + ">" + esc(t.name) + "</button>";
        }).join("") + "</div>";
    } else {
      var list = MORE[state.role] || MORE.coach;
      h = '<header><h2>More</h2><button class="iconbtn" data-close="1" aria-label="Close">' +
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button></header>' +
        '<div class="links">' + list.map(function (m) {
          return '<button data-go="' + m[0] + '"><span style="flex:none;color:var(--lime)">' +
            ICON[m[2]].replace('width="21" height="21"', 'width="18" height="18"') + "</span>" + m[1] + "</button>";
        }).join("") + "</div>";
    }
    sheet.innerHTML = h;
    sheet.hidden = false; scrim.hidden = false;
  }
  function closeSheet() {
    document.getElementById("sheet").hidden = true;
    document.getElementById("scrim").hidden = true;
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-role],[data-tab],[data-go],[data-corner],[data-sub],[data-team],[data-av],[data-act],[data-ach],[data-sheet],[data-close],[data-pickteam]");
    if (!t) return;

    if (t.hasAttribute("data-role")) {
      state.role = t.getAttribute("data-role");
      state.view = ROOTS[state.role];
      closeSheet(); render(); return;
    }
    if (t.hasAttribute("data-sheet")) { openSheet(t.getAttribute("data-sheet")); return; }
    if (t.hasAttribute("data-close")) { closeSheet(); return; }
    if (t.hasAttribute("data-pickteam")) { state.team = t.getAttribute("data-pickteam"); closeSheet(); render(); return; }
    if (t.hasAttribute("data-tab")) { closeSheet(); go(t.getAttribute("data-tab")); return; }
    if (t.hasAttribute("data-go")) { e.preventDefault(); closeSheet(); go(t.getAttribute("data-go")); return; }
    if (t.hasAttribute("data-corner")) { state.corner = t.getAttribute("data-corner"); go("corner"); return; }
    if (t.hasAttribute("data-sub")) { state.sub = t.getAttribute("data-sub"); render(); return; }
    if (t.hasAttribute("data-team")) { state.team = t.getAttribute("data-team"); render(); return; }

    if (t.hasAttribute("data-ach")) {
      state.ach = t.getAttribute("data-ach");
      [].forEach.call(document.querySelectorAll("[data-ach]"), function (b) {
        var on = b.getAttribute("data-ach") === state.ach;
        b.setAttribute("aria-checked", on);
        b.style.background = on ? "var(--lime)" : "";
        b.style.borderColor = on ? "var(--lime)" : "";
        b.style.color = on ? "var(--on-lime)" : "";
      });
      return;
    }

    if (t.hasAttribute("data-av")) {
      var id = t.getAttribute("data-av"), val = t.getAttribute("data-val");
      var cur = state.avail[id] || (function () { for (var i = 0; i < SQUAD.length; i++) if (SQUAD[i].in === id) return SQUAD[i].a; return "none"; })();
      state.avail[id] = cur === val ? "none" : val;
      render(); return;
    }

    if (t.hasAttribute("data-act")) {
      var a = t.getAttribute("data-act");
      if (a === "done" && !state.done) {
        state.done = true; state.xp += 15;
        render(); toast("+15 XP · Technical");
      } else if (a === "checkin") {
        state.checkedIn = true;
        state.inAt = new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
        render(); toast("Checked in · GPS verified");
      } else if (a === "recall") {
        toast("4 recall cards queued");
      } else if (a === "target") {
        toast("Target editor opens here");
      } else if (a === "checkout") {
        var out = new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
        state.log.unshift({ t: "Falcons U15 · today", s: "In " + state.inAt + " · Out " + out + " · GPS verified", k: "ok" });
        state.checkedIn = false; state.inAt = "";
        render(); toast("Checked out");
      }
      return;
    }
  });
  document.addEventListener("submit", function (e) {
    if (e.target.id !== "logform") return;
    e.preventDefault();
    var val = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : ""; };
    var cur = blockWeek();
    state.logs.unshift({
      wk: cur, title: weekInfo(cur).title, team: state.team,
      date: val("lf-date") || weekIso(cur),
      players: Math.max(0, parseInt(val("lf-n"), 10) || 0),
      coach: val("lf-coach"), ach: state.ach, evidence: val("lf-ev"),
      keep: val("lf-keep"), change: val("lf-change"),
      players_note: val("lf-play"), interventions: val("lf-int")
    });
    state.sub = "syllabus";
    go("develop");
    toast("Saved to log");
  });

  document.getElementById("scrim").addEventListener("click", closeSheet);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });

  render();
})();
</script>
</body></html>
