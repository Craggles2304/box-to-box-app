.prep-time i{border-radius:3px;background:currentColor;opacity:.35}
.prep-time i:nth-child(odd){opacity:.7}
.prep-btns{display:flex;gap:8px;flex-wrap:wrap}
.prep-btns .btn{flex:1}
.prep-learn{display:flex;flex-direction:column;gap:14px}
.prep-learn .cpd-title{font:400 clamp(28px,8vw,38px)/.98 var(--display);text-transform:uppercase;margin:0}
.prep-dots{display:flex;gap:4px}
.prep-dots i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.prep-dots i.d,.prep-dots i.c{background:var(--ink)}
.prep-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.prep-facts div{background:var(--surface);border-radius:12px;padding:10px 12px}
.prep-facts small{display:block;font-size:12px;color:var(--muted)}
.prep-facts b{font-size:15px}
.prep-flow{display:flex;flex-direction:column;gap:6px}
.prep-flow div{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border-radius:12px}
.prep-flow span{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700}
.prep-flow small{font-weight:600;color:var(--muted)}
.prep-note{background:var(--surface);border-radius:12px;padding:12px 14px;font-size:15px}
.prep-note p,.prep-note dl{margin:4px 0 0}
.prep-dia{border-radius:var(--r);overflow:hidden}
.prep-dia svg{display:block;width:100%;height:auto}
.prep-practice{margin:0;font-size:17px;line-height:1.45}
.prep-pts{display:flex;flex-wrap:wrap;gap:6px}
.prep-pts h3{width:100%;margin:0 0 2px}
.prep-pts span{background:var(--lime);color:#111;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600}
.prep-pr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prep-pr div{background:var(--surface);border-radius:12px;padding:10px 12px;font-size:14px}
.prep-pr p{margin:4px 0 0}
.prep-nav{display:flex;gap:8px;position:sticky;bottom:calc(var(--nav-h,64px) + 10px)}
.prep-nav .btn{flex:1}
.prep-q{font-size:clamp(24px,6.5vw,32px)!important}
.prep-o{font-size:15px!important;line-height:1.35}
.prep-miss{display:flex;flex-direction:column;gap:8px}
.prep-miss div{background:var(--surface);border-radius:12px;padding:10px 12px}
.prep-miss small{display:block;font-size:12px;color:var(--muted);font-weight:600}
@media (max-width:380px){.prep-pr{grid-template-columns:1fr}}
.prep-nav{background:var(--bg);padding:10px 0;box-shadow:0 -8px 12px var(--bg)}

/* ---------- chat v2: inbox + full-page conversation ---------- */
.inbox{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden}
.ib-row{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ib-row:last-child{border-bottom:0}
.ib-row:active,.ib-row:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.ib-av{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:400 15px/1 var(--display);letter-spacing:.02em;flex:none}
.ib-av.news{background:var(--lime);color:#111;font-size:20px}
.ib-mid{min-width:0;display:flex;flex-direction:column;gap:3px}
.ib-mid b{font-size:16px;font-weight:600}
.ib-mid small{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib-row.unread .ib-mid small{color:var(--ink);font-weight:600}
.ib-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;color:var(--muted)}
.ib-row.unread time{color:var(--ink);font-weight:700}
.ib-dot{width:10px;height:10px;border-radius:50%;background:#ff3b30}

.chat-view{gap:10px}
.chat-head{display:flex;align-items:center;gap:10px;padding:2px 0 10px;border-bottom:1px solid var(--line)}
.chat-head b{display:block;font-size:17px}
.chat-head small{display:block;font-size:12px;color:var(--muted)}
.chat-head .ib-av{width:40px;height:40px}
.chat-back{all:unset;cursor:pointer;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;margin-left:-8px}
.chat-back svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.chat-back:active{background:var(--surface)}
.chat{gap:0}
.chat-list{height:auto;max-height:none;overflow:visible;padding:4px 0 12px;background:none;border:0;border-radius:0;display:flex;flex-direction:column;gap:2px}
.chat-day{align-self:center;margin:14px 0 6px}
.chat-day span{display:inline-block;background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 12px;font:600 12px/1 var(--ui,inherit);text-transform:none;letter-spacing:0}
.cm{display:flex;align-items:flex-end;gap:8px;max-width:88%;margin-top:8px}
.cm.cont{margin-top:2px}
.cm.mine{align-self:flex-end;justify-content:flex-end}
.cm-av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:#6b6b6b}
.cm:not(.last) .cm-av{visibility:hidden}
.cm-av.r-coach{background:#111}
.cm-av.r-parent{background:#2f6fde}
.cm-av.r-player{background:#1a9c5b}
.cm-body{display:flex;flex-direction:column;min-width:0}
.cm .chat-who{display:flex;gap:6px;align-items:baseline;margin:0 0 3px 12px;font:inherit}
.cm .chat-who b{font-size:13px;font-weight:700}
.cm .chat-who b.r-parent{color:#2f6fde}
.cm .chat-who b.r-player{color:#1a9c5b}
.cm .chat-who span{font-size:12px;color:var(--muted);margin:0}
.cm .chat-bubble{background:var(--surface);border:0;border-radius:18px;padding:9px 14px 20px;font-size:16px;line-height:1.35;min-width:70px}
.cm:not(.mine).cont .chat-bubble{border-top-left-radius:6px}
.cm:not(.mine):not(.last) .chat-bubble{border-bottom-left-radius:6px}
.cm.mine .chat-bubble{background:var(--ink);color:var(--bg);border:0}
.cm.mine.cont .chat-bubble{border-top-right-radius:6px}
.cm.mine:not(.last) .chat-bubble{border-bottom-right-radius:6px}
.cm .chat-time{right:12px;bottom:4px;font-size:11px;opacity:.55}
.chat-empty{display:flex;flex-direction:column;align-items:center;gap:4px;padding:48px 0;text-align:center}
.chat-empty span{font-size:36px}
.chat-empty small{color:var(--muted)}
.chat-send{position:sticky;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--bg);padding:10px 0;margin-top:4px;display:flex;gap:8px;align-items:flex-end;box-shadow:0 -10px 14px -6px var(--bg)}
.chat-send textarea{flex:1;min-height:46px;border-radius:23px;border:0;background:var(--surface);padding:12px 18px;font-size:16px}
.chat-go{all:unset;cursor:pointer;flex:none;width:46px;height:46px;border-radius:50%;background:var(--lime);display:grid;place-items:center}
.chat-go svg{width:22px;height:22px;fill:#111;stroke:#111;stroke-width:1.5;stroke-linejoin:round}
.chat-go:active{transform:scale(.94)}
.chat-note{font-size:13px;color:var(--muted);margin:0}

/* ---------- coaches hub ---------- */
.ct-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ct{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:6px;min-height:138px;padding:14px;border-radius:var(--r);background:var(--surface)}
.ct:active{transform:scale(.98)}
.ct b{font:400 22px/1 var(--display);text-transform:uppercase;margin-top:auto}
.ct small{font-size:13px;line-height:1.3;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ct-ico{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:20px}
.ct-ico.sm{width:36px;height:36px;font-size:18px;background:var(--surface)}
.ct-n{position:absolute;top:12px;right:12px;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:#ff3b30;color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}
.ct-prep{grid-column:1/-1;min-height:120px}
.ct.hot{background:#111;color:#fff}
.ct.hot small{color:#ffffffb0}
.ct.hot .ct-ico{background:var(--lime)}
.ct-head{margin-bottom:2px}
.ct-head small{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.ct-head b{font:400 26px/1 var(--display);text-transform:uppercase}
.coach-sub + .view{margin-top:-6px}

.chat-view .chat-head{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));padding-top:8px;z-index:6;background:var(--bg)}

/* ---------- People v2 ---------- */
.admin-in{gap:14px}
.ptabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-radius:14px;padding:4px;gap:4px;position:sticky;top:0;z-index:3}
.ptab{all:unset;cursor:pointer;text-align:center;padding:10px 4px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.ptab span{font-size:12px;font-weight:700;opacity:.7}
.ptab[aria-selected="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px #0002}
.ptab.hot span{background:#ff3b30;color:#fff;opacity:1;border-radius:999px;padding:1px 6px}
.ppane{display:flex;flex-direction:column;gap:10px}
.pnote{margin:0;font-size:13px}
.pfind{display:flex;flex-direction:column;gap:8px}
.psearch{width:100%;box-sizing:border-box;border:0;border-radius:12px;background:var(--surface);padding:12px 14px;font-size:16px;color:var(--ink)}
.pfilt{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.pfilt .chip{flex:none;font-size:13px;padding:6px 12px}
.pfilt .chip span{opacity:.6;font-size:12px}
.plist{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden}
.plist .arow{border-radius:0;background:transparent;padding:0;border-bottom:1px solid var(--line);box-shadow:none}
.plist .arow:last-child{border-bottom:0}
details.prow>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:40px 1fr auto 14px;align-items:center;gap:12px;padding:10px 14px}
details.prow>summary::-webkit-details-marker{display:none}
.pav{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:#6b6b6b;flex:none}
.pav.r-admin,.pav.r-coach{background:#111}
.pav.r-parent{background:#2f6fde}
.pav.r-player{background:#1a9c5b}
.pmid{min-width:0;display:flex;flex-direction:column;gap:2px}
.pmid b{font-size:15px;font-weight:600}
.pmid small{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbell{font-size:14px}
.pchev{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);justify-self:center}
details.prow[open]>summary .pchev{transform:rotate(45deg)}
details.prow[open]{background:var(--bg);box-shadow:inset 3px 0 0 var(--ink)}
details.prow .aedit{padding:4px 14px 16px}
.pwait{padding:14px!important;display:flex;flex-direction:column;gap:10px}
.pw-top{display:flex;gap:12px;align-items:center}
.pw-top .pav{background:#ff9500}
.pempty{display:flex;flex-direction:column;align-items:center;gap:4px;padding:40px 0;text-align:center}
.pempty span{font-size:36px}
.pempty small{color:var(--muted)}
.pset{display:flex;flex-direction:column;gap:10px;padding:16px}
.pset h3{margin:0;font-size:17px}
.pset .gnote{margin:0}
.plist details.prow>summary{display:grid;grid-template-columns:40px minmax(0,1fr) auto 14px;gap:12px;text-align:left}
.plist details.prow>summary>*{grid-row:auto!important;grid-column:auto!important}
.plist details.prow>summary .pchev{visibility:visible!important;text-decoration:none}
.plist .pmid{align-items:flex-start;text-align:left}
.pwait [data-save]{border-radius:999px;width:100%;justify-content:center;text-align:center}
.pwait .glinks{flex-direction:column;align-items:stretch}

/* ---------- check in ---------- */
.ci-card{display:flex;flex-direction:column;gap:10px;background:var(--lime);color:#111;border-radius:var(--r);padding:16px}
.ci-card.done{background:var(--surface);color:var(--ink)}
.ci-top{display:flex;align-items:center;gap:12px}
.ci-top b{display:block;font:400 26px/1 var(--display);text-transform:uppercase}
.ci-top small{display:block;font-size:14px;opacity:.75;margin-top:2px}
.ci-ico{width:44px;height:44px;border-radius:50%;background:#111;color:var(--lime);display:grid;place-items:center;font-size:20px;flex:none}
.ci-card.done .ci-ico{background:#1a9c5b;color:#fff}
.ci-who{margin:0;font-size:14px}
.ci-card .btn.primary{background:#111;color:#fff;border-color:#111}
.ci-sheet{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:flex-end}
.ci-back{position:absolute;inset:0;background:#0008}
.ci-panel{position:relative;background:var(--bg);color:var(--ink);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow-y:auto;width:100%;max-width:560px;margin:0 auto;box-sizing:border-box;animation:ciUp .22s ease-out}
@keyframes ciUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.ci-grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.ci-panel h2{margin:0;font:400 30px/1 var(--display);text-transform:uppercase}
.ci-panel .field{display:flex;flex-direction:column;gap:6px}
.ci-panel input:not([type=checkbox]),.ci-panel select{width:100%;box-sizing:border-box;border:0;border-radius:12px;background:var(--surface);color:var(--ink);padding:13px 14px;font-size:16px}
.ci-ready{display:flex;align-items:center;gap:10px;font-weight:600;padding:12px 14px;border-radius:12px;background:var(--surface)}
.ci-ready input{width:22px;height:22px;accent-color:#111}
.ci-msg{margin:0;font-size:13px;text-align:center}
.ci-msg.bad{color:#d0302b}
.ci-msg a{color:inherit}
.ci-ok{display:flex;flex-direction:column;align-items:stretch;gap:10px;text-align:center;padding:10px 0}
.ci-ok>span{width:64px;height:64px;border-radius:50%;background:#1a9c5b;color:#fff;font-size:32px;display:grid;place-items:center;align-self:center}
.ci-ok h2{margin:4px 0 0}
.ci-ok p{margin:0}
body.ci-open{overflow:hidden}
button.todo{border:0;font:inherit;text-align:left;cursor:pointer;width:100%;box-sizing:border-box}

/* head coach: coaches ready */
.prep-ready{display:flex;flex-direction:column;gap:10px}
.prep-ready h3{margin:6px 0 0}
.pr-block{background:var(--surface);border-radius:var(--r);overflow:hidden}
.pr-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.pr-head b{display:block;font-size:15px}
.pr-head small{display:block;font-size:12px;color:var(--muted)}
.pr-row{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:10px;padding:8px 14px;font-size:15px}
.pav.sm{width:32px;height:32px;font-size:11px}
.pr-details-btn{grid-column:2/-1;justify-self:start;padding:2px 0}
.pr-brief{margin:0 14px 10px 56px;padding:12px;background:var(--bg);border-radius:12px;display:flex;flex-direction:column;gap:8px}
.pr-brief-head{display:flex;flex-direction:column;gap:2px}
.pr-brief-head small,.pr-care small{color:var(--muted);font-size:12px}
.pr-brief p{margin:0}
.pr-care{display:grid;gap:6px}
.pr-care>p{border-top:1px solid var(--line);padding-top:6px}
.pr-care a{color:var(--ink);font-weight:800}
.pr-privacy{font-size:12px}
.pr-ok{color:#1a9c5b;font-weight:700;font-size:14px}
.pr-try{color:#c27c00;font-weight:600;font-size:13px}
.pr-no{color:var(--muted);font-size:13px}

/* ---------- tile pages (home, session) ---------- */
a.ct{text-decoration:none;color:inherit}
.ct.wide{grid-column:1/-1;min-height:110px}
.ct.wide b{font-size:24px}
.ct.wide small{font-size:15px;-webkit-line-clamp:2}
.home-grid .ct{min-height:124px}
.ct-n.soft{background:var(--ink);color:var(--bg)}
.ct.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.ct.hot.sel{box-shadow:inset 0 0 0 2px var(--lime)}
.gscroll{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.gscroll::-webkit-scrollbar{display:none}
.gcard{all:unset;box-sizing:border-box;cursor:pointer;scroll-snap-align:start;flex:none;width:112px;min-height:96px;display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:16px;background:var(--surface)}
.gcard b{font:400 26px/1 var(--display)}
.gcard small{font-size:12px;color:var(--muted);line-height:1.2}
.gcard em{margin-top:auto;font-style:normal;font-size:12px;font-weight:700;color:var(--muted)}
.gcard em.today{color:#111;background:var(--lime);align-self:flex-start;padding:2px 6px;border-radius:6px}
.gcard.on{box-shadow:inset 0 0 0 2px var(--ink)}
.hero .hero-obj{margin:0;font-size:15px;line-height:1.4;opacity:.9}
.t-grid .ct{min-height:112px}
.tpanel{animation:ciUp .18s ease-out}
.m-next{display:flex;flex-direction:column;gap:8px}
.home-grid .ct-prep{grid-column:auto}
.home-grid .ct{min-height:108px;padding:12px}
.home-grid .ct b{font-size:20px}
.home-grid .ct-ico{width:34px;height:34px;font-size:17px;border-radius:10px}
.t-grid .ct{min-height:100px;padding:12px}
.t-grid .ct b{font-size:19px}
.t-grid .ct-ico{width:34px;height:34px;font-size:17px;border-radius:10px}
.gcard{width:120px}.gcard b{font-size:21px;white-space:nowrap}

/* coach check-in */
.cin-card{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:var(--r);padding:16px}
.cin-card.done{box-shadow:inset 3px 0 0 #1a9c5b}
.cin-top b{display:block;font-size:17px}
.cin-top small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.cin-b{display:inline-block;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--bg)}
.cin-b.ok{background:#1a9c5b1f;color:#14804a}
.cin-b.ok2{background:var(--bg);color:var(--ink)}
.cin-b.away{background:#ff95001f;color:#b36200}
.cin-b.no{color:var(--muted)}
.cin-map{font-size:12px;margin-left:6px;color:inherit}
.cin-row{grid-template-columns:32px 1fr auto}
.cin-st{text-align:right}
.cin-venues{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.cin-venues summary{cursor:pointer;display:flex;flex-direction:column;gap:2px}
.cin-venues summary small{color:var(--muted);font-size:13px}
.cin-ven{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.cin-ven b{display:block;font-size:14px}
.cin-ven small{display:block;font-size:12px;color:var(--muted)}
.ct-checkin{order:-1}
.cin-row{grid-template-columns:32px 1fr;align-items:start;padding:10px 14px}
.cin-who{display:flex;flex-direction:column;gap:4px;min-width:0}
.cin-who b{font-weight:600;font-size:15px}

.pp-stats b{font:400 26px/1 var(--display)}
.pp-stats small{font-size:11px;color:#ffffffa0;line-height:1.2}
.pp-fourcorners{padding:16px;background:var(--card,#fff);border:1px solid #dedede;border-radius:16px}.pp-fourcorners h3{margin:0 0 8px}.pp-corner-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.pp-corner{border:1px solid #d5d5d5;border-radius:12px;background:#f6f6f6;color:#171717;padding:13px;text-align:left;display:flex;flex-direction:column;gap:7px;min-height:126px;cursor:pointer}.pp-corner.sel{border:2px solid #a9c900;background:#f4fbd7}.pp-corner b{font-size:16px}.pp-corner small{color:#555;line-height:1.35}.pp-corner span{margin-top:auto;font-size:12px;font-weight:700}.pp-corner-areas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.pp-corner-area{padding:12px;background:#f3f3f3;border-radius:10px;display:flex;flex-direction:column;gap:5px}.pp-corner-area small{font-size:12px;color:#666}@media(max-width:400px){.pp-corner-grid,.pp-corner-areas{grid-template-columns:1fr}}
.pp-grid .ct{min-height:104px;padding:12px}
.pp-grid .ct b{font-size:19px}
.pp-grid .ct-ico{width:34px;height:34px;font-size:17px;border-radius:10px}
.pp-panel{display:flex;flex-direction:column;gap:10px;padding:16px;animation:ciUp .18s ease-out}
.pp-panel h3{margin:0}
.pp-weeks{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.pp-weeks i{aspect-ratio:1;border-radius:5px;background:var(--line)}
.pp-weeks i.on{background:#1a9c5b}
.pp-row{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
.pp-row small{color:var(--muted)}
.pp-skill{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.pp-skill b{display:block;font-size:14px}
.pp-skill small{display:block;font-size:12px;color:var(--muted)}
.pp-spark{width:70px;height:26px}
.pp-spark polyline{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.pp-spark circle{fill:var(--lime);stroke:var(--ink);stroke-width:1.5}
.pp-lv{font-size:12px;font-weight:700;padding:4px 8px;border-radius:999px;background:var(--bg);white-space:nowrap}
.pp-lv.l1{background:#cd7f3233;color:#8a4e17}.pp-lv.l2{background:#c0c0c055;color:#555}.pp-lv.l3{background:#ffd70055;color:#7a5d00}.pp-lv.hit{background:#1a9c5b22;color:#14804a}
.pp-target{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.pp-target.done .pp-tt b{text-decoration:line-through;opacity:.6}
.pp-tt b{display:block;font-size:15px}
.pp-tt small{font-size:12px;color:var(--muted)}
.pp-dots{display:flex;align-items:center;gap:6px}
.pp-dots i,.pp-dots button{all:unset;width:28px;height:10px;border-radius:5px;background:var(--line)}
.pp-dots button{cursor:pointer;height:14px}
.pp-dots .on{background:var(--lime);box-shadow:inset 0 0 0 1px #0002}
.pp-dots span{font-size:12px;font-weight:600;color:var(--muted);margin-left:4px}
.pp-note{margin:0;font-size:14px;background:var(--bg);border-radius:10px;padding:8px 10px}
.pp-tact{display:flex;gap:14px;align-items:center}
.pp-add{display:flex;gap:8px}
.pp-add input{flex:1;min-width:0;border:0;border-radius:12px;background:var(--bg);padding:11px 12px;font-size:16px;color:var(--ink)}
.pp-home{display:flex;flex-direction:column;gap:2px;background:var(--bg);border-radius:12px;padding:10px 12px}
.pp-home small{font-size:12px;color:var(--muted)}
.pp-goal{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.pp-goal input{width:20px;height:20px;accent-color:#1a9c5b}
.pp-goal span{flex:1}
.pp-goal.done span{text-decoration:line-through;opacity:.6}
.pp-badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.pp-badge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:10px 6px;border-radius:12px;background:var(--bg);opacity:.35;filter:grayscale(1)}

.pp-kids{display:flex;flex-direction:column}
.pp-kidrow{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:36px 1fr 12px;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.pp-kidrow:first-child{border-top:0}
.pp-kidrow b{display:block;font-size:15px}
.pp-kidrow small{display:block;font-size:12px;color:var(--muted)}
.pp-kidrow i{font-style:normal;color:var(--muted)}
.pp-addkid summary{list-style:none;display:inline-block;cursor:pointer}
.pp-addkid summary::-webkit-details-marker{display:none}
.pp-kidform{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.pp-kidform input:not([type=checkbox]),.pp-kidform select,.pp-link select{width:100%;box-sizing:border-box;border:0;border-radius:12px;background:var(--bg);padding:12px;font-size:16px;color:var(--ink)}
.pp-kidform textarea{width:100%;box-sizing:border-box;border:0;border-radius:12px;background:var(--bg);padding:12px;font:inherit;font-size:15px;color:var(--ink);resize:vertical}
.care-none{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.care-none input{width:auto!important}
.pp-review{display:flex;flex-direction:column;gap:8px;padding-top:8px;border-top:1px solid var(--line)}
.pp-kidg{display:flex;flex-wrap:wrap;gap:6px}
.pp-code{display:flex;flex-direction:column;gap:10px;padding:16px}
.pp-codebig{font:700 34px/1 ui-monospace,monospace;letter-spacing:.12em;text-align:center;background:var(--lime);color:#111;border-radius:14px;padding:16px 8px}
.pp-code ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.pp-edit summary{cursor:pointer}
.pp-link{display:flex;flex-direction:column;gap:10px}
.pp-kid{min-height:96px}
.ci-kids{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- match plans: team sheet + tactics ---------- */
.mp-leads{font-size:14px;background:var(--surface);border-radius:12px;padding:10px 14px}
.mp-row{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border-radius:var(--r)}
.mp-date{display:flex;flex-direction:column;align-items:center;background:var(--bg);border-radius:10px;padding:6px 0}
.mp-date b{font:400 22px/1 var(--display)}
.mp-date small{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted)}
.mp-mid{min-width:0}.mp-mid b{display:block;font-size:15px}.mp-mid small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-pitch{position:relative;aspect-ratio:68/90;width:100%;max-width:420px;margin:0 auto;border-radius:16px;overflow:hidden;background:repeating-linear-gradient(180deg,#2e8b3e 0 12.5%,#33963f 12.5% 25%);box-shadow:inset 0 0 0 3px #ffffffb0}
.mp-pitch i{position:absolute;border:2px solid #ffffffb0;pointer-events:none}
.mp-mid{}
.mp-pitch .mp-mid{left:0;right:0;top:50%;height:0;border-width:2px 0 0}
.mp-pitch .mp-circle{left:50%;top:50%;width:26%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)}
.mp-pitch .mp-box{left:25%;right:25%;height:14%}
.mp-pitch .mp-box.t{top:-2px}.mp-pitch .mp-box.b{bottom:-2px}
.mp-slot{all:unset;position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;width:76px;text-align:center}
button.mp-slot{cursor:pointer}
.mp-dot{width:36px;height:36px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-size:11px;font-weight:800;box-shadow:0 2px 6px #0004}
.mp-slot.on .mp-dot{background:#111;color:var(--lime)}
.mp-slot.me .mp-dot{background:var(--lime);color:#111;box-shadow:0 0 0 4px #ffffffa0,0 2px 6px #0004}
.mp-nm{font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000a;line-height:1.1;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-pitch.edit .mp-slot:not(.on) .mp-nm{opacity:.75}
.mp-subs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:14px}
.mp-subs>b{margin-right:4px}
.mp-subs span{background:var(--surface);border-radius:999px;padding:5px 10px;font-weight:600}
.mp-subs span.me{background:var(--lime);color:#111}
.mp-view,.mp-ed{display:flex;flex-direction:column;gap:12px}
.mp-head h2{margin:2px 0 0;font:400 30px/1 var(--display);text-transform:uppercase}
.mp-head small{color:var(--muted)}
.mp-obj{background:var(--lime);color:#111;border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px}
.mp-obj span{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.mp-obj b{font-size:20px;line-height:1.25}
.mp-you{background:#111;color:#fff;border-radius:14px;padding:12px 14px;font-size:15px}
.mp-you b{color:var(--lime)}
.mp-sec{display:flex;flex-direction:column;gap:8px}
.mp-sech{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mp-sech h3{margin:0}
.mp-sech select{border:0;border-radius:10px;background:var(--surface);padding:8px 10px;font-size:15px;color:var(--ink);font-weight:700}
.mp-keys{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:16px;font-weight:600}
.mp-tac{background:var(--surface);border-radius:var(--r);padding:14px;gap:12px}
.mp-tac b{font-size:14px}.mp-tac p{margin:2px 0 0;font-size:15px;white-space:pre-wrap}
.mp-ed .field{display:flex;flex-direction:column;gap:6px}
.mp-ed input:not([type=checkbox]),.mp-ed textarea{width:100%;box-sizing:border-box;border:0;border-radius:12px;background:var(--surface);color:var(--ink);padding:12px;font:16px/1.35 inherit}
.mp-key{margin:0}
.mp-actions{display:flex;gap:8px}.mp-actions .btn{flex:1}
.mp-plist{display:flex;flex-direction:column;max-height:46vh;overflow-y:auto;border-radius:12px;background:var(--surface)}
.mp-pbtn{all:unset;cursor:pointer;padding:12px 14px;border-bottom:1px solid var(--line);font-size:16px}
.mp-pbtn small{font-size:11px;color:var(--muted);margin-left:6px}
.mp-pbtn.used{opacity:.5}
.mp-card{display:flex;flex-direction:column;gap:6px;background:#111;color:#fff;border-radius:var(--r);padding:16px;text-decoration:none;background-image:linear-gradient(135deg,transparent 60%,#2e8b3e55)}
.mp-card-k{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--lime)}
.mp-card b{font:400 26px/1 var(--display);text-transform:uppercase}
.mp-card-o{font-size:15px;line-height:1.3}
.mp-card-b{font-size:14px;font-weight:700;color:var(--lime)}
.mp-sech select{width:auto;flex:none}.mp-sech h3{white-space:nowrap}

/* ---------- icon system: line icons in solid blocks (replaces emoji) ---------- */
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.ct-ico{background:#111!important;color:#fff;border-radius:10px}

.ib-av.news{border-radius:50%;color:var(--lime)}

.cpd-callout>span,.cpd-talk>span{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#111;color:var(--lime);font-size:0}

.cpd-callout.warn>span{background:var(--lime);color:#111}
.gplayer>span:first-child{width:44px;height:44px;border-radius:12px;background:#111;color:var(--lime);display:grid;place-items:center;font-size:0;flex:none}
.gplayer>span:first-child .ic{width:24px;height:24px}
.cpd-mo-n{display:inline-flex;align-items:center;gap:4px}
.cpd-mo-n .ic{width:18px;height:18px}
.cpd-rate-b span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#111;color:#fff;font:400 18px/1 var(--display)!important}
.cpd-rate-b.on span{background:var(--lime);color:#111}
.mp-obj span{display:inline-flex;align-items:center;gap:6px}
.mp-you{display:flex;align-items:center;gap:8px}
.mp-you .ic{color:var(--lime);width:18px;height:18px}
.mp-tac b{display:inline-flex;align-items:center;gap:6px}
.mp-card-o{display:flex;gap:6px;align-items:flex-start}
.mp-card-o .ic{color:var(--lime);margin-top:2px}
.pp-badge .pp-bi{width:44px;height:44px;border-radius:12px;background:#111;color:#fff;display:grid;place-items:center}
.pp-badge .pp-bi .ic{width:22px;height:22px}
.pp-badge.on .pp-bi.b{background:#a8672e}.pp-badge.on .pp-bi.s{background:#8d949b}.pp-badge.on .pp-bi.g{background:#c9a227;color:#111}
.pp-badge.on .pp-bi:not(.b):not(.s):not(.g){background:#111;color:var(--lime)}
.pp-badge{opacity:.4;filter:grayscale(1)}
.pp-note{display:flex;gap:8px;align-items:flex-start}
.pp-note .ic{margin-top:2px;flex:none}
.ic.lead{width:14px;height:14px;color:#c9a227;fill:#c9a227;vertical-align:-2px}
.apush{display:inline-flex;align-items:center;gap:4px}
.pbell .ic{width:18px;height:18px;color:var(--muted)}
.cin-b{display:inline-flex;align-items:center;gap:5px}
.cin-b .ic{width:14px;height:14px}
.mp-leads{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

.chat-note,.chat-head small{display:flex;align-items:center;gap:5px}

.btn .ic{width:18px;height:18px;margin-right:2px}
.dg-cell b .ic{width:26px;height:26px}
.cpd-tick .ic{width:14px;height:14px}
.cpd-row small .ic{width:14px;height:14px;opacity:.7}
.eyebrow .ic{width:14px;height:14px}
.hero-obj{display:flex;gap:8px;align-items:flex-start}
.hero-obj .ic{color:var(--lime);margin-top:2px}
.cpd-style-chip{display:inline-flex;align-items:center;gap:5px}
.cpd-style-chip .ic{width:14px;height:14px}
.cpd-res-bars span{display:inline-flex;align-items:center;gap:6px}
.venue>span:first-child{display:inline-flex;align-items:center;gap:4px}
.venue .ic{width:14px;height:14px}
.mp-head small{display:inline-flex;align-items:center;gap:4px}
.ct-grid .ct-prep{grid-column:auto;min-height:138px}

/* ---------- Match Room ---------- */
.mr{display:flex;flex-direction:column;gap:14px}
.mr-next{background:#111;color:#fff;border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;background-image:linear-gradient(160deg,transparent 55%,#2e8b3e44)}
.mr-next-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mr-k{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--lime)}
.mr-ha{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:#fff;color:#111}
.mr-ha.a{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px #fff}
.mr-next h2{margin:0;font:400 clamp(30px,9vw,40px)/.95 var(--display);text-transform:uppercase}
.mr-times{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mr-times div{background:#ffffff14;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.mr-times small{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#ffffffa0}
.mr-times b{font:400 30px/1 var(--display)}
.mr-times div:first-child{background:var(--lime);color:#111}
.mr-times div:first-child small{color:#111a}
.mr-times.light div{background:var(--surface)}

.mr-obj{display:flex;gap:8px;align-items:flex-start;font-size:15px;font-weight:600}
.mr-obj .ic{color:var(--lime);margin-top:2px}
.mr-next .rsvp{background:#ffffff10;border-radius:12px;padding:10px 12px}
.mr-acts{display:flex;gap:8px;flex-wrap:wrap}
.mr-acts .btn{flex:1;justify-content:center}
.mr-next .btn:not(.primary){background:#ffffff1a;color:#fff;border-color:transparent}
.mr-next .btn.primary{background:var(--lime);color:#111;border-color:var(--lime)}
.mr-wait{font-size:13px;color:#ffffffa0!important}
.vmap{position:relative;display:block;border-radius:14px;overflow:hidden;height:150px;background:var(--surface);text-decoration:none;color:inherit}
.vmap iframe{position:absolute;inset:0;width:100%;height:calc(100% + 40px);border:0;pointer-events:none;filter:grayscale(.25)}
.vmap-bar{position:absolute;left:8px;right:8px;bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:#111;color:#fff;border-radius:10px;padding:8px 10px;font-size:13px}
.vmap-bar span{display:inline-flex;align-items:center;gap:5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vmap-bar b{color:var(--lime);white-space:nowrap}
.mr-sec{display:flex;flex-direction:column;gap:8px}
.mr-sec h3{margin:0}
.mr-list{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden}
.mr-row{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.mr-row:first-child{border-top:0}
.mr-row .mp-date{background:var(--bg)}
.mr-rr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.mr-res{font-size:12px;font-weight:800;padding:4px 8px;border-radius:8px;white-space:nowrap}
.mr-res.w{background:#1a9c5b;color:#fff}.mr-res.l{background:#d0302b;color:#fff}.mr-res.d{background:#8d949b;color:#fff}
.mr-stat{font-size:12px!important;padding:5px 10px!important;display:inline-flex;align-items:center;gap:4px}
.mr-stat .ic{width:13px;height:13px}
.mr-boards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mr-board{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mr-board h4{margin:0;font:400 18px/1 var(--display);text-transform:uppercase}
.mr-board div{display:grid;grid-template-columns:16px 1fr auto;gap:6px;align-items:center;font-size:13px}
.mr-board div span:nth-child(2){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr-pos{font-weight:800;color:var(--muted)}
.mr-board b{font:400 18px/1 var(--display)}
@media (max-width:380px){.mr-boards{grid-template-columns:1fr 1fr}}
.st-step{display:grid;grid-template-columns:1fr 44px 48px 44px;align-items:center;gap:6px;background:var(--surface);border-radius:12px;padding:8px 8px 8px 14px;font-weight:600}
.st-step button{all:unset;cursor:pointer;width:44px;height:40px;border-radius:10px;background:#111;color:#fff;display:grid;place-items:center;font-size:22px;font-weight:600}
.st-step b{text-align:center;font:400 28px/1 var(--display)}
.st-rate{display:flex;gap:6px}
.st-rate button{all:unset;cursor:pointer;flex:1;height:44px;border-radius:12px;background:var(--surface);display:grid;place-items:center;font:400 20px/1 var(--display)}
.st-rate button[aria-pressed="true"]{background:#111;color:var(--lime)}
.mr-headline{display:flex;flex-direction:column}

.mr-next .rsvp{border-top:0;margin-top:0;color:#fff}
.mr-next .rsvp-q,.mr-next .rsvp .muted,.mr-next .rsvp summary{color:#ffffffc0}
.mr-next .rsvp-btn{background:#ffffff1f;color:#fff;border-color:transparent}
.mr-next .rsvp-btn.yes[aria-pressed="true"]{background:var(--lime);color:#111;border-color:var(--lime)}
.mr-next .rsvp-btn[aria-pressed="true"]:not(.yes){background:#fff;color:#111}
.vmap{background-color:#e8eee6;background-image:linear-gradient(#ffffff 2px,transparent 2px),linear-gradient(90deg,#ffffff 2px,transparent 2px),linear-gradient(35deg,transparent 46%,#d9e3d6 46% 54%,transparent 54%);background-size:44px 44px,44px 44px,100% 100%}
.vmap::before{content:"";position:absolute;left:50%;top:38%;width:22px;height:22px;transform:translate(-50%,-50%) rotate(-45deg);border-radius:50% 50% 50% 0;background:#111;box-shadow:0 0 0 4px #ffffffb0}
.vmap iframe{z-index:1;background:transparent}
.vmap-bar{z-index:2}

/* Match Room: team sheet + game plan up front */
.mr-sheet .mp-sech{display:flex;align-items:center;gap:8px}
.mr-sheet .mp-sech h3{margin:0 auto 0 0}
.mr-sheet .mp-pitch{max-width:360px}
.mr-ghost{position:relative;max-width:360px;width:100%;margin:0 auto}
.mr-ghost .mp-pitch{filter:saturate(.35) brightness(.8)}
.mr-ghost-msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:78%;background:#111;color:#fff;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;box-shadow:0 10px 30px #0006}
.mr-ghost-msg .ic{color:var(--lime);width:22px;height:22px}
.mr-ghost-msg b{font-size:15px}.mr-ghost-msg span{font-size:13px;opacity:.75}
.mp-plan{gap:10px}
.mp-plan .mp-keys{margin:0}
.mr-more>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.mr-more>summary::-webkit-details-marker{display:none}
.mr-more>summary::after{content:"›";font-size:22px;transform:rotate(90deg);transition:transform .2s;opacity:.6}
.mr-more[open]>summary::after{transform:rotate(-90deg)}
.mr-more>summary h3{margin:0}
.mr-row button.pill{border:0;cursor:pointer}
.mr-row a.pill{text-decoration:none}

/* Match Room: coming / not coming */
.mr-rsvp{margin:0;padding:0;border:0}
.mr-next .mr-rsvp .rsvp-q{color:#fff}
.mr-next .mr-rsvp .rsvp-btn{background:#ffffff14;border-color:#ffffff40;color:#fff;min-height:42px;padding:10px 16px;display:inline-flex;align-items:center;gap:6px}
.mr-next .mr-rsvp .rsvp-btn.yes[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:#111}
.mr-next .mr-rsvp .rsvp-btn.no[aria-pressed="true"]{background:#fff;border-color:#fff;color:#c62828}
.mr-rsvp.mini .rsvp-row{flex-wrap:nowrap;gap:4px}
.mr-rsvp.mini .rsvp-btn{min-height:34px;width:38px;padding:0;justify-content:center;font-size:15px}
.mr-out{font-size:12px;font-weight:700;color:var(--ink)}
.mr-tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px}
.mr-tally div{background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.mr-tally b{font:400 30px/1 var(--display)}
.mr-tally small{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.mr-tally .y b{color:var(--good)}.mr-tally .n b{color:var(--bad)}
.mr-who h5{margin:4px 0 0;font:800 11px/1 var(--ui);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.mr-names{display:flex;flex-wrap:wrap;gap:6px}
.mr-names span{border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600;background:var(--surface)}
.mr-names.y span{background:var(--good-bg);color:var(--good)}
.mr-names.n span{background:var(--bad-bg,#fdecec);color:var(--bad)}
.mr-next .mr-rsvp .rsvp-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mr-next .mr-rsvp .rsvp-q{grid-column:1/-1}
.mr-next .mr-rsvp .rsvp-btn{justify-content:center}
/* compact folds (calendar day lists) */
.fold{background:var(--surface);border-radius:14px;overflow:hidden}
.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:56px}
.fold>summary::-webkit-details-marker{display:none}
.fd-bar{width:4px;align-self:stretch;border-radius:4px;background:var(--ink);flex:none}
.fd-bar.k-match{background:#ff7a45}.fd-bar.k-session{background:var(--lime)}.fd-bar.k-event{background:#6aa8ff}
.fd-time{font:700 14px/1 var(--ui);min-width:44px;font-variant-numeric:tabular-nums}
.fd-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fd-mid b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fd-mid small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fd-mark{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800}
.fd-mark.y{background:var(--good-bg);color:var(--good)}.fd-mark.n{background:var(--bad-bg,#fdecec);color:var(--bad)}
.fd-chev{flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px;transition:transform .2s}
.fold[open] .fd-chev{transform:rotate(-135deg);margin-bottom:-4px}
.fold-body>.cal-item{border-radius:0;margin:0;border-top:1px solid var(--line)}
.day-list{gap:8px}
/* news: short by default, tap to read */
.news-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.news-del{all:unset;cursor:pointer;margin-left:auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:18px}
.news-del:hover{background:var(--bg)}
.news-item.clamp{cursor:pointer}
.news-item.clamp:not(.open) .news-body{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-more{font-size:13px;font-weight:700;color:var(--ink)}
.news-more::after{content:"Read more ›"}
.news-item.open .news-more::after{content:"Show less"}
.more-btn{align-self:center;margin:4px auto 0;display:block}
.chat-more{all:unset;cursor:pointer;align-self:center;margin:6px 0 10px;padding:7px 14px;border-radius:999px;background:var(--surface);font-size:13px;font-weight:600}
.news-list .news-item{padding:12px 14px;gap:4px}
/* ===== Player Passport v2 ===== */
.pp-level{display:flex;align-items:center;gap:12px;background:#ffffff12;border-radius:14px;padding:10px 12px}
.pp-lvm{font-size:34px;line-height:1}
.pp-belt{width:38px;height:14px;border-radius:4px;box-shadow:inset 0 0 0 2px #ffffff40;flex:none}
.pp-lvn{width:38px;height:38px;border-radius:10px;background:var(--lime);color:#111;display:grid;place-items:center;font:400 22px/1 var(--display);flex:none}
.pp-lvt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pp-lvt b{font-size:16px}.pp-lvt small{font-size:12px;color:#ffffffb0}
.pp-xp{height:7px;border-radius:7px;background:#ffffff22;overflow:hidden}
.pp-xp i{display:block;height:100%;background:var(--lime);border-radius:7px;transition:width .4s}
.pp-xpn{font:400 26px/1 var(--display);text-align:right}.pp-xpn small{display:block;font:700 10px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:#ffffffa0;margin-top:2px}
.pp-potw{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#ffd60a,#ffb300);color:#111;border-radius:var(--r);padding:12px 14px}
.pp-potw>span{font-size:30px;line-height:1}.pp-potw>span .ic{width:30px;height:30px}
.pp-potw small{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.pp-potw b{display:block;font-size:16px;margin:2px 0}
.pp-week{display:flex;flex-direction:column;gap:8px}.pp-week h3{margin:0}
.pm-list{display:flex;flex-direction:column;gap:10px}
.pm{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line)}
.pm-k{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:700}
.pm-top b{display:block;font:400 24px/1 var(--display);text-transform:uppercase}.pm-top small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.pm-hero{display:flex;align-items:center;gap:12px}
.pm-emo{font-size:44px;line-height:1;width:64px;height:64px;border-radius:18px;background:var(--bg);display:grid;place-items:center;flex:none}
.pm-hero b{display:block;font:400 26px/1 var(--display);text-transform:uppercase}.pm-hero small{display:block;color:var(--muted);font-size:14px;margin-top:3px}
.pm-word{background:var(--lime);color:#111;border-radius:14px;padding:10px 14px}
.pm-word small{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.pm-word b{font-size:20px}
.pm-obj{margin:0;font-size:14px;line-height:1.4}
.pm-pts{display:flex;flex-wrap:wrap;gap:6px}.pm-pts span{background:var(--bg);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600}
.pm-steps{display:flex;flex-direction:column;gap:6px}
.pm-step{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:12px;padding:10px}
.pm-si{width:32px;height:32px;border-radius:10px;background:#111;color:#fff;display:grid;place-items:center;flex:none;font-size:18px}
.pm-step.on .pm-si{background:var(--good,#1a9c5b);color:#fff}
.pm-sl{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pm-sl b{font-size:14px}.pm-sl small{font-size:13px;color:var(--muted);line-height:1.35}
.pm-btn{align-self:flex-start;margin-top:2px}
.pm-btn.go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pm-bar{position:relative;height:24px;border-radius:12px;background:var(--bg);overflow:hidden}
.pm-bar i{position:absolute;inset:0 auto 0 0;background:var(--lime);border-radius:12px}
.pm-bar span{position:relative;display:block;text-align:center;font:700 12px/24px var(--ui)}
/* little ones: bigger, brighter, friendlier */
.pp-mini .pp-card{background:#111;background-image:radial-gradient(circle at 100% 0,#ffd60a40 0,transparent 55%),radial-gradient(circle at 0 100%,#2f7bff40 0,transparent 50%)}
.pp-mini .pp-av{font-size:30px;background:#fff}
.pm-mini{border:2px solid var(--lime)}
.pm-mini .pm-step{padding:12px}.pm-mini .pm-si{background:var(--bg);font-size:22px;width:38px;height:38px}
.pm-mini .pm-step.on .pm-si{background:var(--good-bg,#e7f7ee)}
.pm-mini .pm-sl b{font-size:16px}
.pp-badges.stickers .pp-badge{opacity:1;filter:none;background:var(--bg)}
.pp-badges.stickers .pp-bi{background:transparent;color:inherit;font-size:34px;width:48px;height:48px}
.pp-badges.stickers .pp-badge:not(.on) .pp-bi{opacity:.4}
button.pp-badge{border:0;font:inherit;color:inherit;cursor:pointer}
.pp-ladder{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pp-ladder span{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;opacity:.35;min-width:58px}
.pp-ladder span.on{opacity:1}.pp-ladder span.cur small{font-weight:800}
.pp-ladder em{font-style:normal;font-size:26px;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--bg);font-weight:800}
.pp-ladder em.belt{width:42px;height:16px;border-radius:4px;box-shadow:inset 0 0 0 1px #0002;margin:13px 0}
.pp-ladder small{font-size:11px;text-align:center}
.pp-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pp-scard{background:var(--bg);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.pp-scard span{font-size:24px;line-height:1}.pp-scard .ic{width:22px;height:22px;color:var(--good,#1a9c5b)}
.pp-scard b{font-size:13px}.pp-scard small{font-size:11px;color:var(--muted)}
.pp-award{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px;background:var(--bg)}
.pp-award>span{font-size:24px;line-height:1}.pp-award.potw>span{color:#b58900}
.pp-award div{flex:1}.pp-award b{display:block;font-size:14px}.pp-award small{display:block;font-size:12px;color:var(--muted)}.pp-award p{margin:4px 0 0;font-size:14px}
.pp-code{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:12px;padding:12px}
.pp-codev{display:inline-block;font:400 30px/1 var(--display);letter-spacing:.12em;background:#111;color:var(--lime);border-radius:10px;padding:10px 14px;user-select:all}
.pp-weeks i.x2{background:#127a46}.pp-weeks i.x3{background:#0b5531}
/* quiz */
.pq-prog{display:flex;gap:6px}.pq-prog i{flex:1;height:5px;border-radius:5px;background:var(--line)}.pq-prog i.on{background:var(--good,#1a9c5b)}.pq-prog i.cur{background:var(--ink)}
.pq h2{font-size:22px;margin:4px 0}
.pq-opts{display:flex;flex-direction:column;gap:8px}
.pq-opt{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:14px;font-size:16px;font-weight:600;line-height:1.3;background:var(--surface)}
.pq-opt.right{border-color:var(--good,#1a9c5b);background:var(--good-bg,#e7f7ee)}.pq-opt.wrong{border-color:var(--bad);background:var(--bad-bg,#fdecec)}
.pq-mini .pq-opt{font-size:20px;padding:18px}.pq-mini h2{font-size:26px}
.pq-fb{margin:0;font-weight:700}
.pq-done{align-items:center;text-align:center}.pq-big{font-size:56px;line-height:1}.pq-big .ic{width:56px;height:56px}
/* coach: squad passports + weekly sign-off */
.sq-week{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;background:#111;color:#fff;border-radius:var(--r);padding:16px;background-image:radial-gradient(circle at 100% 0,#d4f30033 0,transparent 55%)}
.sq-week .eyebrow{color:var(--lime)}
.sq-week>b{font:400 28px/1 var(--display);text-transform:uppercase}.sq-week>small{color:#ffffffb0;font-size:13px}
.sq-wstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.sq-wstats span{background:#ffffff14;border-radius:10px;padding:8px;font-size:11px;color:#ffffffb0}.sq-wstats b{display:block;font:400 22px/1 var(--display);color:#fff}
.sq-wgo{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--lime);font-size:14px}
.sq-h{display:flex;align-items:center;justify-content:space-between;gap:8px}.sq-h h3{margin:0}
.sq-import{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;background:var(--lime);color:#111;border-radius:12px;padding:12px;font-weight:700;font-size:14px}
.sq-ok .ic{width:14px;height:14px;color:var(--good,#1a9c5b);vertical-align:-2px}
.sq-members>summary{list-style:none;cursor:pointer}.sq-members>summary::-webkit-details-marker{display:none}.sq-members>summary h3{margin:0}
.sq-members .team-sq{padding:8px 0 0;box-shadow:none;background:none}
.sq-sheet .ci-panel{max-height:92vh}
.sq-rows{display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.sq-row{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:12px;padding:8px}
.sq-n{flex:1;min-width:0}.sq-n b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sq-n small{font-size:11px;color:var(--muted)}
.sq-tg{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 10px;font:700 12px/1 var(--ui);cursor:pointer;min-height:34px}
.sq-tg.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.sq-tg:disabled{opacity:.4}
.sq-ic{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bg)}
.sq-ic .ic{width:18px;height:18px}.sq-ic.gold{background:#ffd60a;color:#111}
@media (max-width:380px){.sq-row .pp-av{display:none}}
details.pm>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
details.pm>summary::-webkit-details-marker{display:none}
details.pm:not([open]){padding:10px 14px}
details.pm[open]>summary{padding-bottom:4px;border-bottom:1px solid var(--line)}
.pm-se{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:24px;flex:none}
.pm-sm{flex:1;min-width:0}.pm-sm small{display:block;font-size:11px;font-weight:700;color:var(--muted)}.pm-sm b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm-sn{font:700 12px/1 var(--ui);background:var(--bg);border-radius:999px;padding:6px 9px}.pm-sn.on{background:var(--good,#1a9c5b);color:#fff}
details.pm[open] .fd-chev{transform:rotate(-135deg);margin-bottom:-4px}
/* safeguarding */
.chat-ro{display:flex;gap:8px;align-items:flex-start;background:var(--surface);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--muted);position:sticky;bottom:calc(62px + env(safe-area-inset-bottom,0px));margin:4px 0 0}
.chat-ro .ic{width:15px;height:15px;flex:none;vertical-align:-2px}
.chat-rep{position:absolute;top:-10px;right:-10px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .15s}
.chat-rep .ic{width:14px;height:14px}
.cm:hover .chat-rep,.chat-bubble.show .chat-rep,.chat-bubble.show .chat-del,.chat-rep:focus-visible{opacity:1}
.rep-why{display:flex;flex-wrap:wrap;gap:6px}
.safe{display:flex;flex-direction:column;gap:10px}
.safe-set{display:flex;flex-direction:column;gap:8px}
.safe-row{display:flex;align-items:center;gap:12px}.safe-row>div{flex:1}.safe-row b{display:block}.safe-row small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.tgl{all:unset;cursor:pointer;width:52px;height:30px;border-radius:30px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tgl i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:left .2s}
.tgl.on{background:var(--good,#1a9c5b)}.tgl.on i{left:25px}
.rep-list{display:flex;flex-direction:column;gap:8px}
.rep-card{display:flex;flex-direction:column;gap:6px}.rep-card.open{border-left:4px solid var(--bad)}
.rep-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.rep-top small{color:var(--muted);font-size:12px}
.pill.rep-open{background:var(--bad);color:#fff}
.rep-d{margin:0;font-size:14px}
.rep-q{margin:0;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px;white-space:pre-wrap}.rep-q small{display:block;color:var(--muted);font-size:12px;margin-bottom:4px;white-space:normal}
